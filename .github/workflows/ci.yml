            ASSERT (result::jsonb)->>'error' = 'NOT_FOUND', 'Test 27 FAILED: expected NOT_FOUND, got: ' || result::text;
            RAISE NOTICE 'Test 27 PASSED: service_role executes begin_expiry_refund_request without JWT-GUC';

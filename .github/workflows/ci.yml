            ASSERT (result::jsonb)->>'error' = 'ACTIVE_JOBS_EXIST', 'DEL-1 FAILED: ' || result::text;
            RAISE NOTICE 'DEL-1 PASSED: active jobs block deletion';
            UPDATE jobs SET status = 'completed' WHERE id = 'dd000000-aaaa-aaaa-aaaa-dd0000000000'::uuid;
          END $$;

          -- DEL-2: Successful _internal_process_deletion sets deletion_processing (NOT deleted)
          DO $$
          DECLARE result JSON; v_profile RECORD; v_notifs INT;
          BEGIN
            SELECT _internal_process_deletion('dd000000-1111-1111-1111-dd0000000000'::uuid) INTO result;
            ASSERT (result::jsonb)->>'success' = 'true', 'DEL-2 FAILED: ' || result::text;
            ASSERT (result::jsonb)->>'stage' = 'deletion_processing', 'DEL-2 FAILED: wrong stage';
            SELECT * INTO v_profile FROM profiles WHERE id = 'dd000000-1111-1111-1111-dd0000000000'::uuid;
            ASSERT v_profile.status = 'deletion_processing', 'DEL-2 FAILED: status not deletion_processing';
            ASSERT v_profile.email IS NULL, 'DEL-2 FAILED: email not cleared';
            ASSERT v_profile.phone IS NULL, 'DEL-2 FAILED: phone not cleared';
            SELECT count(*) INTO v_notifs FROM notifications WHERE user_id = 'dd000000-1111-1111-1111-dd0000000000'::uuid;
            ASSERT v_notifs = 0, 'DEL-2 FAILED: notifications not deleted';
            RAISE NOTICE 'DEL-2 PASSED: internal deletion sets deletion_processing + anonymizes';
          END $$;


          INSERT INTO jobs (id, customer_id, provider_id, service_id, status, payment_status, created_at)
          VALUES ('bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa'::uuid, 'bbbbbbbb-1111-1111-1111-bbbbbbbbbbbb'::uuid,
                  'bbbbbbbb-2222-2222-2222-bbbbbbbbbbbb'::uuid, 'test-svc-rt', 'accepted', 'paid', now());
          -- Seed a tracking message for the active job (as postgres, bypasses RLS)
          INSERT INTO realtime.messages (topic, extension, payload, event, private)
          VALUES ('job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa', 'broadcast', '{"lat":40.7}', 'location_update', true);

          -- RT-1: Policies exist on realtime.messages
          DO $$
          DECLARE v_count INT;
          BEGIN
            SELECT count(*) INTO v_count FROM pg_policy WHERE polrelid = 'realtime.messages'::regclass;
            ASSERT v_count >= 2, 'RT-1 FAILED: expected at least 2 policies, got ' || v_count;
            RAISE NOTICE 'RT-1 PASSED: % policies on realtime.messages', v_count;
          END $$;

          -- RT-2: Policies are scoped to job-tracking topics
          DO $$
          DECLARE v_count INT;
          BEGIN
            SELECT count(*) INTO v_count FROM pg_policy
            WHERE polrelid = 'realtime.messages'::regclass
              AND (pg_get_expr(polqual, polrelid) LIKE '%job-tracking-%'
                   OR pg_get_expr(polwithcheck, polrelid) LIKE '%job-tracking-%');
            ASSERT v_count >= 2, 'RT-2 FAILED: policies must reference job-tracking';
            RAISE NOTICE 'RT-2 PASSED: policies scoped to job-tracking topics';
          END $$;

          -- RT-3: Customer can SELECT own active tracking message
          DO $$
          DECLARE v_count INT;
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'bbbbbbbb-1111-1111-1111-bbbbbbbbbbbb'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            SET LOCAL "realtime.topic" = 'job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa';
            SELECT count(*) INTO v_count FROM realtime.messages
            WHERE topic = 'job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa';
            ASSERT v_count = 1, 'RT-3 FAILED: customer must see 1 message, got ' || v_count;
            RAISE NOTICE 'RT-3 PASSED: customer can SELECT own active tracking message';
          END $$;

          -- RT-4: Assigned provider can SELECT own active tracking message
          DO $$
          DECLARE v_count INT;
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'bbbbbbbb-2222-2222-2222-bbbbbbbbbbbb'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            SET LOCAL "realtime.topic" = 'job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa';
            SELECT count(*) INTO v_count FROM realtime.messages
            WHERE topic = 'job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa';
            ASSERT v_count = 1, 'RT-4 FAILED: provider must see 1 message, got ' || v_count;
            RAISE NOTICE 'RT-4 PASSED: provider can SELECT own active tracking message';
          END $$;

          -- RT-5: Unrelated user CANNOT SELECT tracking messages
          DO $$
          DECLARE v_count INT;
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'bbbbbbbb-3333-3333-3333-bbbbbbbbbbbb'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            SET LOCAL "realtime.topic" = 'job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa';
            SELECT count(*) INTO v_count FROM realtime.messages
            WHERE topic = 'job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa';
            ASSERT v_count = 0, 'RT-5 FAILED: unrelated user saw ' || v_count || ' messages';
            RAISE NOTICE 'RT-5 PASSED: unrelated user denied SELECT';
          END $$;

          -- RT-6: Anonymous role denied
          DO $$
          BEGIN
            SET LOCAL role TO 'anon';
            BEGIN
              PERFORM 1 FROM realtime.messages;
              RAISE EXCEPTION 'RT-6 FAILED: anon must be denied';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'RT-6 PASSED: anon denied access';
            END;
          END $$;

          -- RT-7: Wrong-length malformed topic fails closed
          DO $$
          DECLARE v_count INT;
          BEGIN
            INSERT INTO realtime.messages (topic, extension, payload, event, private)
            VALUES ('job-tracking-short', 'broadcast', '{}', 'test', true);
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'bbbbbbbb-1111-1111-1111-bbbbbbbbbbbb'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';

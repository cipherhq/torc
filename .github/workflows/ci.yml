          END $$;

          -- DEL-5: Idempotent finalization
          DO $$
          DECLARE result JSON;
          BEGIN
            SELECT _internal_finalize_deletion('dd000000-1111-1111-1111-dd0000000000'::uuid) INTO result;
            ASSERT (result::jsonb)->>'already_deleted' = 'true', 'DEL-5 FAILED: ' || result::text;
            RAISE NOTICE 'DEL-5 PASSED: idempotent finalization';
          END $$;

          -- ROLE-1: authenticated cannot call _internal_process_deletion
          DO $$
          BEGIN
            SET LOCAL role TO 'authenticated';
            BEGIN
              PERFORM _internal_process_deletion('dd000000-2222-2222-2222-dd0000000000'::uuid);
              RAISE EXCEPTION 'ROLE-1 FAILED: authenticated should not execute';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'ROLE-1 PASSED: authenticated denied _internal_process_deletion';
            END;
          END $$;

          -- ROLE-2: authenticated cannot call _internal_finalize_deletion
          DO $$
          BEGIN
            SET LOCAL role TO 'authenticated';
            BEGIN
              PERFORM _internal_finalize_deletion('dd000000-2222-2222-2222-dd0000000000'::uuid);
              RAISE EXCEPTION 'ROLE-2 FAILED: authenticated should not execute';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'ROLE-2 PASSED: authenticated denied _internal_finalize_deletion';
            END;
          END $$;

          -- ROLE-3: anon cannot call internal functions
          DO $$
          BEGIN
            SET LOCAL role TO 'anon';
            BEGIN
              PERFORM _internal_process_deletion('dd000000-2222-2222-2222-dd0000000000'::uuid);
              RAISE EXCEPTION 'ROLE-3 FAILED';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'ROLE-3 PASSED: anon denied internal deletion';
            END;
          END $$;

          -- ROLE-4: service_role can call _internal_process_deletion
          DO $$
          DECLARE result JSON;
          BEGIN
            SET LOCAL role TO 'service_role';
            SELECT _internal_process_deletion('dd000000-2222-2222-2222-dd0000000000'::uuid) INTO result;
            -- Should fail with INVALID_STATUS (user is active, not pending_deletion) but NOT permission denied
            ASSERT (result::jsonb)->>'error' = 'INVALID_STATUS', 'ROLE-4 FAILED: service_role should be able to call: ' || result::text;
            RAISE NOTICE 'ROLE-4 PASSED: service_role can execute _internal_process_deletion';
          END $$;

          -- ROLE-5: request_account_deletion works for authenticated self
          DO $$
          DECLARE result JSON;
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'dd000000-2222-2222-2222-dd0000000000'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            SELECT request_account_deletion(NULL) INTO result;
            ASSERT (result::jsonb)->>'success' = 'true', 'ROLE-5 FAILED: ' || result::text;
            RAISE NOTICE 'ROLE-5 PASSED: authenticated self can request deletion';
          END $$;

          -- DEL-6: Financial records retained
          DO $$
          DECLARE v_count INT;
          BEGIN

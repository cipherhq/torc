            RAISE NOTICE 'Test 18 PASSED: Checkout with paid_at → rejected';
            DELETE FROM job_expiry_refund_operations WHERE job_id = 'aaaaaaaa-0000-0000-0000-eeee00000018'::uuid;
            DELETE FROM checkouts WHERE id = 'aaaaaaaa-0000-0000-0000-cccc00000018'::uuid;
            DELETE FROM jobs WHERE id = 'aaaaaaaa-0000-0000-0000-eeee00000018'::uuid;

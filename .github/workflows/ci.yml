          DO $$
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'ffffffff-1111-1111-1111-ffffffffffff'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            UPDATE provider_profiles SET is_online = true WHERE id = 'ffffffff-1111-1111-1111-ffffffffffff'::uuid;
            RAISE NOTICE 'PROV-DB-3 PASSED: provider can update is_online';
          END $$;

          -- PROV-DB-4: Provider rating/total_jobs write remains possible
          DO $$
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'ffffffff-1111-1111-1111-ffffffffffff'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            UPDATE provider_profiles SET rating = 4.5, total_jobs = 10 WHERE id = 'ffffffff-1111-1111-1111-ffffffffffff'::uuid;
            RAISE NOTICE 'PROV-DB-4 PASSED: provider can update rating/total_jobs';
          END $$;

          -- PROV-DB-5: Provider cannot UPDATE is_verified false -> true
          DO $$
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'ffffffff-1111-1111-1111-ffffffffffff'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            BEGIN
              UPDATE provider_profiles SET is_verified = true WHERE id = 'ffffffff-1111-1111-1111-ffffffffffff'::uuid;
              RAISE EXCEPTION 'PROV-DB-5 FAILED';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'PROV-DB-5 PASSED: provider cannot self-verify';
            END;
          END $$;

          -- PROV-DB-6: Verified provider cannot UPDATE is_verified true -> false
          DO $$
          BEGIN
            -- Admin verifies first
            UPDATE provider_profiles SET is_verified = true WHERE id = 'ffffffff-1111-1111-1111-ffffffffffff'::uuid;
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'ffffffff-1111-1111-1111-ffffffffffff'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            BEGIN
              UPDATE provider_profiles SET is_verified = false WHERE id = 'ffffffff-1111-1111-1111-ffffffffffff'::uuid;
              RAISE EXCEPTION 'PROV-DB-6 FAILED';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'PROV-DB-6 PASSED: verified provider cannot self-unverify';
            END;
          END $$;

          -- PROV-DB-7: Provider cannot INSERT with is_verified=true
          DO $$
          BEGIN
            -- Remove existing row first
            DELETE FROM provider_profiles WHERE id = 'ffffffff-1111-1111-1111-ffffffffffff'::uuid;
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'ffffffff-1111-1111-1111-ffffffffffff'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            BEGIN
              INSERT INTO provider_profiles (id, services, is_verified) VALUES ('ffffffff-1111-1111-1111-ffffffffffff'::uuid, '{towing}', true);
              RAISE EXCEPTION 'PROV-DB-7 FAILED';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'PROV-DB-7 PASSED: provider cannot INSERT with is_verified=true';
            END;
          END $$;

          -- PROV-DB-8: Provider can INSERT with verification omitted (defaults false)
          DO $$
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'ffffffff-1111-1111-1111-ffffffffffff'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            INSERT INTO provider_profiles (id, services) VALUES ('ffffffff-1111-1111-1111-ffffffffffff'::uuid, '{towing}');
            RAISE NOTICE 'PROV-DB-8 PASSED: provider can INSERT with default verification';
          END $$;

          -- PROV-DB-9: Provider UPSERT with is_verified=true fails
          DO $$
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'ffffffff-1111-1111-1111-ffffffffffff'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            BEGIN
              INSERT INTO provider_profiles (id, services, is_verified) VALUES ('ffffffff-1111-1111-1111-ffffffffffff'::uuid, '{towing}', true)
              ON CONFLICT (id) DO UPDATE SET is_verified = true;
              RAISE EXCEPTION 'PROV-DB-9 FAILED';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'PROV-DB-9 PASSED: UPSERT with is_verified=true fails';
            END;
          END $$;

          -- PROV-DB-10: Combined avatar_url + is_verified=true fails atomically
          DO $$
          DECLARE v_url TEXT;
          BEGIN
            -- Set known avatar first
            UPDATE provider_profiles SET avatar_url = 'original.jpg' WHERE id = 'ffffffff-1111-1111-1111-ffffffffffff'::uuid;
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'ffffffff-1111-1111-1111-ffffffffffff'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            BEGIN
              UPDATE provider_profiles SET avatar_url = 'hacked.jpg', is_verified = true WHERE id = 'ffffffff-1111-1111-1111-ffffffffffff'::uuid;
              RAISE EXCEPTION 'PROV-DB-10 FAILED';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
            -- Verify avatar_url was NOT changed (atomic failure)
            SELECT avatar_url INTO v_url FROM provider_profiles WHERE id = 'ffffffff-1111-1111-1111-ffffffffffff'::uuid;
            ASSERT v_url = 'original.jpg', 'PROV-DB-10 FAILED: avatar_url should remain original, got ' || COALESCE(v_url, 'NULL');
            RAISE NOTICE 'PROV-DB-10 PASSED: combined mutation fails atomically';
          END $$;

          -- PROV-DB-16: Admin can set is_verified=true
          DO $$
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'ffffffff-2222-2222-2222-ffffffffffff'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            UPDATE provider_profiles SET is_verified = true WHERE id = 'ffffffff-1111-1111-1111-ffffffffffff'::uuid;
            RAISE NOTICE 'PROV-DB-16 PASSED: admin can verify provider';
          END $$;

          -- PROV-DB-17: Admin can set is_verified=false
          DO $$
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'ffffffff-2222-2222-2222-ffffffffffff'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            UPDATE provider_profiles SET is_verified = false WHERE id = 'ffffffff-1111-1111-1111-ffffffffffff'::uuid;
            RAISE NOTICE 'PROV-DB-17 PASSED: admin can suspend provider';
          END $$;

          -- PROV-DB-21: Unrelated user cannot update another provider's row
          DO $$
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'ffffffff-3333-3333-3333-ffffffffffff'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            UPDATE provider_profiles SET services = '{hacking}' WHERE id = 'ffffffff-1111-1111-1111-ffffffffffff'::uuid;
            -- RLS silently filters — check row wasn't actually changed
            DECLARE v_services TEXT[];
            BEGIN
              SELECT services INTO v_services FROM provider_profiles WHERE id = 'ffffffff-1111-1111-1111-ffffffffffff'::uuid;
              ASSERT v_services != '{hacking}', 'PROV-DB-21 FAILED: unrelated user modified provider row';
              RAISE NOTICE 'PROV-DB-21 PASSED: unrelated user cannot modify provider';
            END;
          END $$;

          -- PROV-DB-23: Role escalation trigger (prevent_role_self_escalation) is from database/migrations/
          -- which is not in the CI migration chain. Verify the verification guard does NOT interfere with
          -- profiles updates (role escalation protection is tested separately in production).
          DO $$
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'ffffffff-1111-1111-1111-ffffffffffff'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            -- Provider can update normal profile fields
            UPDATE profiles SET first_name = 'Updated' WHERE id = 'ffffffff-1111-1111-1111-ffffffffffff'::uuid;
            RAISE NOTICE 'PROV-DB-23 PASSED: normal profile update works alongside verification guard';
          END $$;

          -- PROV-DB-24: Anon cannot bypass
          DO $$
          BEGIN
            SET LOCAL role TO 'anon';
            BEGIN
              UPDATE provider_profiles SET is_verified = true WHERE id = 'ffffffff-1111-1111-1111-ffffffffffff'::uuid;
              -- anon may silently fail via RLS (no matching rows)
              RAISE NOTICE 'PROV-DB-24 PASSED: anon has no effect';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'PROV-DB-24 PASSED: anon denied';
            END;
          END $$;

          -- Cleanup
          DELETE FROM provider_profiles WHERE id = 'ffffffff-1111-1111-1111-ffffffffffff'::uuid;
          DELETE FROM profiles WHERE id IN ('ffffffff-1111-1111-1111-ffffffffffff'::uuid, 'ffffffff-2222-2222-2222-ffffffffffff'::uuid, 'ffffffff-3333-3333-3333-ffffffffffff'::uuid);
          DELETE FROM auth.users WHERE id IN ('ffffffff-1111-1111-1111-ffffffffffff'::uuid, 'ffffffff-2222-2222-2222-ffffffffffff'::uuid, 'ffffffff-3333-3333-3333-ffffffffffff'::uuid);
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $$ SELECT gen_random_uuid(); $$;

          DO $$ BEGIN RAISE NOTICE 'All 16 PROV-001 verification protection tests passed.'; END $$;
          SQL
      - name: Test provider suspension enforcement (SUSP-001)
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/torc_test" -v ON_ERROR_STOP=1 <<'SQL'
          -- Setup
          INSERT INTO auth.users (id, email) VALUES
            ('11111111-aaaa-aaaa-aaaa-111111111111'::uuid, 'susp-prov@test.com'),
            ('11111111-bbbb-bbbb-bbbb-111111111111'::uuid, 'susp-admin@test.com'),
            ('11111111-cccc-cccc-cccc-111111111111'::uuid, 'susp-cust@test.com')
          ON CONFLICT DO NOTHING;
          INSERT INTO profiles (id, role, first_name, status) VALUES
            ('11111111-aaaa-aaaa-aaaa-111111111111'::uuid, 'provider', 'SuspProv', 'active'),
            ('11111111-bbbb-bbbb-bbbb-111111111111'::uuid, 'admin', 'SuspAdmin', 'active'),
            ('11111111-cccc-cccc-cccc-111111111111'::uuid, 'customer', 'SuspCust', 'active')
          ON CONFLICT DO NOTHING;
          INSERT INTO provider_profiles (id, services, is_online) VALUES
            ('11111111-aaaa-aaaa-aaaa-111111111111'::uuid, '{towing}', true)
          ON CONFLICT DO NOTHING;
          INSERT INTO provider_locations (provider_id, latitude, longitude, is_online, updated_at) VALUES
            ('11111111-aaaa-aaaa-aaaa-111111111111'::uuid, 40.7128, -74.006, true, now())
          ON CONFLICT DO NOTHING;
          INSERT INTO services (id, name, base_price) VALUES ('test-svc-susp', 'Susp Test', 50) ON CONFLICT DO NOTHING;

          -- SUSP-DB-1: Provider can update own first_name
          DO $$
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT '11111111-aaaa-aaaa-aaaa-111111111111'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            UPDATE profiles SET first_name = 'Updated' WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
            RAISE NOTICE 'SUSP-DB-1 PASSED';
          END $$;

          -- SUSP-DB-3: Suspended provider cannot change status to active
          DO $$
          BEGIN
            UPDATE profiles SET status = 'suspended', suspended_at = now() WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT '11111111-aaaa-aaaa-aaaa-111111111111'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            BEGIN
              UPDATE profiles SET status = 'active' WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
              RAISE EXCEPTION 'SUSP-DB-3 FAILED';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'SUSP-DB-3 PASSED: suspended provider cannot self-unsuspend';
            END;
          END $$;

          -- SUSP-DB-6: Suspended provider cannot clear suspended_at
          DO $$
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT '11111111-aaaa-aaaa-aaaa-111111111111'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            BEGIN
              UPDATE profiles SET suspended_at = NULL WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
              RAISE EXCEPTION 'SUSP-DB-6 FAILED';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'SUSP-DB-6 PASSED: cannot clear suspended_at';
            END;
          END $$;

          -- SUSP-DB-8: Combined normal + forbidden fails atomically
          DO $$
          DECLARE v_name TEXT;
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT '11111111-aaaa-aaaa-aaaa-111111111111'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            BEGIN
              UPDATE profiles SET first_name = 'Hacked', status = 'active' WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
              RAISE EXCEPTION 'SUSP-DB-8 FAILED';
            EXCEPTION WHEN insufficient_privilege THEN NULL; END;
            SET LOCAL role TO 'postgres';
            SELECT first_name INTO v_name FROM profiles WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
            ASSERT v_name = 'Updated', 'SUSP-DB-8 FAILED: name should be Updated, got ' || v_name;
            RAISE NOTICE 'SUSP-DB-8 PASSED: atomic failure';
          END $$;

          -- SUSP-DB-DELETION: Active user can self-set pending_deletion
          DO $$
          BEGIN
            UPDATE profiles SET status = 'active' WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT '11111111-aaaa-aaaa-aaaa-111111111111'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            UPDATE profiles SET status = 'pending_deletion' WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
            RAISE NOTICE 'SUSP-DB-DELETION PASSED: active user can request deletion';
            -- Reset for next tests
            SET LOCAL role TO 'postgres';
            UPDATE profiles SET status = 'active' WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
          END $$;

          -- SUSP-DB-DELETION-BLOCK: Suspended user cannot self-set pending_deletion
          DO $$
          BEGIN
            UPDATE profiles SET status = 'suspended', suspended_at = now() WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT '11111111-aaaa-aaaa-aaaa-111111111111'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            BEGIN
              UPDATE profiles SET status = 'pending_deletion' WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
              RAISE EXCEPTION 'SUSP-DB-DELETION-BLOCK FAILED';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'SUSP-DB-DELETION-BLOCK PASSED: suspended cannot request deletion';
            END;
          END $$;

          -- SUSP-DB-9: Admin can suspend
          DO $$
          BEGIN
            -- First unsuspend as postgres for clean state
            UPDATE profiles SET status = 'active', suspended_at = NULL WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT '11111111-bbbb-bbbb-bbbb-111111111111'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            UPDATE profiles SET status = 'suspended', suspended_at = now() WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
            RAISE NOTICE 'SUSP-DB-9 PASSED: admin can suspend';
          END $$;

          -- SUSP-DB-10: Admin can unsuspend
          DO $$
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT '11111111-bbbb-bbbb-bbbb-111111111111'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            UPDATE profiles SET status = 'active', suspended_at = NULL WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
            RAISE NOTICE 'SUSP-DB-10 PASSED: admin can unsuspend';
          END $$;

          -- SUSP-MATCH-1: Active provider returned by get_nearby_providers
          DO $$
          DECLARE v_count INT;
          BEGIN
            SET LOCAL role TO 'authenticated';
            SELECT count(*) INTO v_count FROM get_nearby_providers(40.7128, -74.006, 10, 'towing');
            ASSERT v_count >= 1, 'SUSP-MATCH-1 FAILED: active provider not found';
            RAISE NOTICE 'SUSP-MATCH-1 PASSED: active provider in matching';
          END $$;

          -- SUSP-MATCH-2: Suspended provider NOT returned
          DO $$
          DECLARE v_count INT;
          BEGIN
            UPDATE profiles SET status = 'suspended' WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
            SET LOCAL role TO 'authenticated';
            SELECT count(*) INTO v_count FROM get_nearby_providers(40.7128, -74.006, 10, 'towing');
            ASSERT v_count = 0, 'SUSP-MATCH-2 FAILED: suspended provider should not appear';
            RAISE NOTICE 'SUSP-MATCH-2 PASSED: suspended provider excluded';
          END $$;

          -- SUSP-MATCH-3: Unverified but not suspended retains current behavior
          DO $$
          DECLARE v_count INT;
          BEGIN
            UPDATE profiles SET status = 'active' WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
            UPDATE provider_profiles SET is_verified = false WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
            SET LOCAL role TO 'authenticated';
            SELECT count(*) INTO v_count FROM get_nearby_providers(40.7128, -74.006, 10, 'towing');
            ASSERT v_count >= 1, 'SUSP-MATCH-3 FAILED: unverified non-suspended should still match';
            RAISE NOTICE 'SUSP-MATCH-3 PASSED: PROV-002 not changed';
          END $$;

          -- SUSP-ACCEPT-1: Active provider can accept
          DO $$
          DECLARE result JSONB;
          BEGIN
            INSERT INTO jobs (id, customer_id, service_id, status, payment_status, created_at)
            VALUES ('11111111-0000-0000-0000-aaaaaaaaaaaa'::uuid, '11111111-cccc-cccc-cccc-111111111111'::uuid, 'test-svc-susp', 'pending', 'paid', now());
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT '11111111-aaaa-aaaa-aaaa-111111111111'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            SELECT accept_job('11111111-0000-0000-0000-aaaaaaaaaaaa'::uuid, '11111111-aaaa-aaaa-aaaa-111111111111'::uuid) INTO result;
            ASSERT result->>'success' = 'true', 'SUSP-ACCEPT-1 FAILED: ' || result::text;
            RAISE NOTICE 'SUSP-ACCEPT-1 PASSED: active provider accepts';
          END $$;

          -- SUSP-ACCEPT-2: Suspended provider cannot accept
          DO $$
          DECLARE result JSONB;
          BEGIN
            -- Complete current job, suspend provider, create new pending job
            UPDATE jobs SET status = 'completed' WHERE id = '11111111-0000-0000-0000-aaaaaaaaaaaa'::uuid;
            UPDATE profiles SET status = 'suspended' WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
            INSERT INTO jobs (id, customer_id, service_id, status, payment_status, created_at)
            VALUES ('11111111-0000-0000-0000-bbbbbbbbbbbb'::uuid, '11111111-cccc-cccc-cccc-111111111111'::uuid, 'test-svc-susp', 'pending', 'paid', now());
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT '11111111-aaaa-aaaa-aaaa-111111111111'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            SELECT accept_job('11111111-0000-0000-0000-bbbbbbbbbbbb'::uuid, '11111111-aaaa-aaaa-aaaa-111111111111'::uuid) INTO result;
            ASSERT result->>'error' = 'PROVIDER_SUSPENDED', 'SUSP-ACCEPT-2 FAILED: ' || result::text;
            RAISE NOTICE 'SUSP-ACCEPT-2 PASSED: suspended provider rejected';
          END $$;

          -- SUSP-ACCEPT-3: Rejected acceptance leaves job unchanged
          DO $$
          DECLARE v_status TEXT; v_pid UUID;
          BEGIN
            SELECT status, provider_id INTO v_status, v_pid FROM jobs WHERE id = '11111111-0000-0000-0000-bbbbbbbbbbbb'::uuid;
            ASSERT v_status = 'pending', 'SUSP-ACCEPT-3 FAILED: status should be pending';
            ASSERT v_pid IS NULL, 'SUSP-ACCEPT-3 FAILED: provider_id should be NULL';
            RAISE NOTICE 'SUSP-ACCEPT-3 PASSED: job unchanged';
          END $$;

          -- SUSP-ACCEPT-4: No events/notifications for rejected acceptance
          DO $$
          DECLARE v_count INT;
          BEGIN
            SELECT count(*) INTO v_count FROM job_events WHERE job_id = '11111111-0000-0000-0000-bbbbbbbbbbbb'::uuid AND event_type = 'job_accepted';
            ASSERT v_count = 0, 'SUSP-ACCEPT-4 FAILED: should have 0 acceptance events';
            SELECT count(*) INTO v_count FROM notifications WHERE action_url LIKE '%11111111-0000-0000-0000-bbbbbbbbbbbb%';
            ASSERT v_count = 0, 'SUSP-ACCEPT-4 FAILED: should have 0 notifications';
            RAISE NOTICE 'SUSP-ACCEPT-4 PASSED: no side effects';
          END $$;

          -- SUSP-ACCEPT-12: Unverified but not suspended can still accept (PROV-002 unchanged)
          DO $$
          DECLARE result JSONB;
          BEGIN
            UPDATE profiles SET status = 'active' WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
            UPDATE provider_profiles SET is_verified = false WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT '11111111-aaaa-aaaa-aaaa-111111111111'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            SELECT accept_job('11111111-0000-0000-0000-bbbbbbbbbbbb'::uuid, '11111111-aaaa-aaaa-aaaa-111111111111'::uuid) INTO result;
            ASSERT result->>'success' = 'true', 'SUSP-ACCEPT-12 FAILED: unverified non-suspended should accept: ' || result::text;
            RAISE NOTICE 'SUSP-ACCEPT-12 PASSED: PROV-002 unchanged';
          END $$;

          -- Cleanup
          DELETE FROM job_events WHERE job_id IN ('11111111-0000-0000-0000-aaaaaaaaaaaa'::uuid, '11111111-0000-0000-0000-bbbbbbbbbbbb'::uuid);
          DELETE FROM notifications WHERE user_id IN ('11111111-aaaa-aaaa-aaaa-111111111111'::uuid, '11111111-cccc-cccc-cccc-111111111111'::uuid);
          DELETE FROM jobs WHERE customer_id = '11111111-cccc-cccc-cccc-111111111111'::uuid;
          DELETE FROM provider_locations WHERE provider_id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
          DELETE FROM provider_profiles WHERE id = '11111111-aaaa-aaaa-aaaa-111111111111'::uuid;
          DELETE FROM profiles WHERE id IN ('11111111-aaaa-aaaa-aaaa-111111111111'::uuid, '11111111-bbbb-bbbb-bbbb-111111111111'::uuid, '11111111-cccc-cccc-cccc-111111111111'::uuid);
          DELETE FROM services WHERE id = 'test-svc-susp';
          DELETE FROM auth.users WHERE id IN ('11111111-aaaa-aaaa-aaaa-111111111111'::uuid, '11111111-bbbb-bbbb-bbbb-111111111111'::uuid, '11111111-cccc-cccc-cccc-111111111111'::uuid);
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $$ SELECT gen_random_uuid(); $$;

          DO $$ BEGIN RAISE NOTICE 'All 14 SUSP-001 suspension enforcement tests passed.'; END $$;
          SQL
      - name: Test claim-token ownership RPCs
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/torc_test" -v ON_ERROR_STOP=1 <<'SQL'
          -- Test 1: First claim returns a UUID token
          DO $$
          DECLARE v_token1 UUID; v_token2 UUID;
          BEGIN
            v_token1 := claim_notification_delivery('test:concurrent', 'email', 'test');
            ASSERT v_token1 IS NOT NULL, 'First claim must return a token';

            -- Test 2: Active lease — second caller gets NULL
            v_token2 := claim_notification_delivery('test:concurrent', 'email', 'test');
            ASSERT v_token2 IS NULL, 'Active lease must return NULL';

            -- Test 3: Stale worker rejection — mark with wrong token
            DECLARE v_ok BOOLEAN;
            BEGIN
              v_ok := mark_notification_delivery('test:concurrent', gen_random_uuid(), 'sent');
              ASSERT v_ok = false, 'Wrong token must return false';
            END;

            -- Test 4: Correct token mark succeeds
            DECLARE v_ok BOOLEAN;
            BEGIN
              v_ok := mark_notification_delivery('test:concurrent', v_token1, 'sent');
              ASSERT v_ok = true, 'Correct token must return true';
            END;

            -- Test 5: Sent permanence — future claim returns NULL
            v_token2 := claim_notification_delivery('test:concurrent', 'email', 'test');
            ASSERT v_token2 IS NULL, 'Sent event must never be reclaimable';

            -- Test 6: Failed retry
            DECLARE v_tokenA UUID; v_tokenB UUID;
            BEGIN
              v_tokenA := claim_notification_delivery('test:retry', 'sms', 'test');
              ASSERT v_tokenA IS NOT NULL, 'Retry claim A must return token';
              PERFORM mark_notification_delivery('test:retry', v_tokenA, 'failed');
              v_tokenB := claim_notification_delivery('test:retry', 'sms', 'test');
              ASSERT v_tokenB IS NOT NULL, 'Retry after failure must return token';
              ASSERT v_tokenB != v_tokenA, 'Retry must get NEW token';
            END;

            -- Test 7: Stale reclaim with expired lease
            DECLARE v_tokenC UUID; v_tokenD UUID;
            BEGIN
              v_tokenC := claim_notification_delivery('test:stale', 'email', 'test');
              ASSERT v_tokenC IS NOT NULL;
              -- Manually expire the lease
              UPDATE notification_delivery_log
                SET lease_expires_at = now() - interval '1 minute'
                WHERE event_key = 'test:stale';
              v_tokenD := claim_notification_delivery('test:stale', 'email', 'test');
              ASSERT v_tokenD IS NOT NULL, 'Stale reclaim must return new token';
              ASSERT v_tokenD != v_tokenC, 'Stale reclaim token must differ';
              -- Old token mark must fail
              DECLARE v_old_ok BOOLEAN;
              BEGIN
                v_old_ok := mark_notification_delivery('test:stale', v_tokenC, 'sent');
                ASSERT v_old_ok = false, 'Old token must be rejected';
              END;
              -- New token mark must succeed
              DECLARE v_new_ok BOOLEAN;
              BEGIN
                v_new_ok := mark_notification_delivery('test:stale', v_tokenD, 'sent');
                ASSERT v_new_ok = true, 'New token must succeed';
              END;
            END;

            -- Cleanup
            DELETE FROM notification_delivery_log WHERE event_key LIKE 'test:%';
            RAISE NOTICE 'All claim-token ownership tests passed.';
          END;
          $$;
          SQL

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets in source code
        run: |
          set -euo pipefail
          FOUND=0
          for pattern in 'sk_live_[a-zA-Z0-9]{10,}' 'eyJhbGci[a-zA-Z0-9_=-]{20,}'; do
            MATCHES=$(grep -rnE "$pattern" apps/ packages/ supabase/functions/ \
              --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" \
              | grep -v node_modules | grep -v '.test.' | grep -v 'pk_test_placeholder' || true)
            if [ -n "$MATCHES" ]; then
              echo "ERROR: Secret pattern '$pattern' found:"
              echo "$MATCHES"
              FOUND=1
            fi
          done
          if find . -name '.env' -not -name '.env.example' -not -path '*/node_modules/*' | grep -q .; then
            echo "ERROR: .env file found in repository"
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            echo "FAILED: Secrets or .env files detected"
            exit 1
          fi
          echo "Security scan passed."

  edge-function-check:
    name: Edge Function Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x
      - name: Check send-email compiles
        run: deno check supabase/functions/send-email/index.ts
      - name: Check send-sms compiles
        run: deno check supabase/functions/send-sms/index.ts
      - name: Check create-payment-intent compiles
        run: deno check supabase/functions/create-payment-intent/index.ts
      - name: Check stripe-webhook compiles
        run: deno check supabase/functions/stripe-webhook/index.ts
      - name: Check expire-pending-jobs compiles
        run: deno check supabase/functions/expire-pending-jobs/index.ts

            RAISE NOTICE 'Test 20 PASSED: Safe unpaid job → no_refund_required';
            DELETE FROM notifications WHERE user_id = 'aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa'::uuid;
            DELETE FROM job_status_audit WHERE job_id = 'aaaaaaaa-0000-0000-0000-eeee00000020'::uuid;
            DELETE FROM job_events WHERE job_id = 'aaaaaaaa-0000-0000-0000-eeee00000020'::uuid;
            DELETE FROM job_expiry_refund_operations WHERE job_id = 'aaaaaaaa-0000-0000-0000-eeee00000020'::uuid;
            DELETE FROM checkouts WHERE id = 'aaaaaaaa-0000-0000-0000-cccc00000020'::uuid;
            DELETE FROM jobs WHERE id = 'aaaaaaaa-0000-0000-0000-eeee00000020'::uuid;

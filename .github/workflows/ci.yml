      - name: Test account deletion compliance (store compliance)
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/torc_test" -v ON_ERROR_STOP=1 <<'SQL'
          -- Setup: two users for cross-user testing
          INSERT INTO auth.users (id, email) VALUES
            ('dd000000-1111-1111-1111-dd0000000000'::uuid, 'del-cust@test.com'),
            ('dd000000-2222-2222-2222-dd0000000000'::uuid, 'del-other@test.com')
          ON CONFLICT DO NOTHING;
          INSERT INTO profiles (id, role, email, first_name, last_name, phone, status) VALUES
            ('dd000000-1111-1111-1111-dd0000000000'::uuid, 'customer', 'del-cust@test.com', 'John', 'Doe', '+15551234567', 'active'),
            ('dd000000-2222-2222-2222-dd0000000000'::uuid, 'customer', 'del-other@test.com', 'Jane', 'Other', '+15559999999', 'active')
          ON CONFLICT DO NOTHING;
          INSERT INTO services (id, name, base_price) VALUES ('test-svc-del', 'Del Test', 50) ON CONFLICT DO NOTHING;
          INSERT INTO notifications (user_id, type, title, message) VALUES
            ('dd000000-1111-1111-1111-dd0000000000'::uuid, 'service', 'Test', 'Test notification');

          -- AUTH-1: _internal_process_deletion NOT executable by authenticated
          DO $$
          DECLARE v_granted BOOL;
          BEGIN
            SELECT EXISTS (
              SELECT 1 FROM information_schema.role_routine_grants
              WHERE routine_name = '_internal_process_deletion' AND grantee = 'authenticated'
            ) INTO v_granted;
            ASSERT NOT v_granted, 'AUTH-1 FAILED: authenticated can execute _internal_process_deletion';
            RAISE NOTICE 'AUTH-1 PASSED: _internal_process_deletion not executable by authenticated';
          END $$;

          -- AUTH-2: _internal_finalize_deletion NOT executable by authenticated
          DO $$
          DECLARE v_granted BOOL;
          BEGIN
            SELECT EXISTS (
              SELECT 1 FROM information_schema.role_routine_grants
              WHERE routine_name = '_internal_finalize_deletion' AND grantee = 'authenticated'
            ) INTO v_granted;
            ASSERT NOT v_granted, 'AUTH-2 FAILED: authenticated can execute _internal_finalize_deletion';
            RAISE NOTICE 'AUTH-2 PASSED: _internal_finalize_deletion not executable by authenticated';
          END $$;

          -- AUTH-3: PUBLIC and anon cannot execute internal functions
          DO $$
          DECLARE v_granted BOOL;
          BEGIN
            SELECT EXISTS (
              SELECT 1 FROM information_schema.role_routine_grants
              WHERE routine_name = '_internal_process_deletion' AND grantee IN ('PUBLIC', 'anon')
            ) INTO v_granted;
            ASSERT NOT v_granted, 'AUTH-3 FAILED';
            RAISE NOTICE 'AUTH-3 PASSED: PUBLIC/anon cannot execute internal deletion';
          END $$;

          -- AUTH-4: request_account_deletion is self-only (auth.uid = caller)
          DO $$
          DECLARE result JSON;
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'dd000000-1111-1111-1111-dd0000000000'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            SELECT request_account_deletion('want to leave') INTO result;
            ASSERT (result::jsonb)->>'success' = 'true', 'AUTH-4 FAILED: ' || result::text;
            ASSERT (result::jsonb)->>'status' = 'pending_deletion', 'AUTH-4 FAILED: wrong status';
            RAISE NOTICE 'AUTH-4 PASSED: self-service deletion request works';
          END $$;

          -- AUTH-5: check_deletion_eligibility cross-user blocked
          DO $$
          DECLARE result JSON;
          BEGIN
            -- User 2 trying to check user 1
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'dd000000-2222-2222-2222-dd0000000000'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            SELECT check_deletion_eligibility('dd000000-1111-1111-1111-dd0000000000'::uuid) INTO result;
            ASSERT (result::jsonb)->>'error' = 'UNAUTHORIZED', 'AUTH-5 FAILED: ' || result::text;
            RAISE NOTICE 'AUTH-5 PASSED: cross-user eligibility check blocked';
          END $$;

          -- AUTH-6: check_deletion_eligibility self-access works
          DO $$
          DECLARE result JSON;
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'dd000000-1111-1111-1111-dd0000000000'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            SELECT check_deletion_eligibility('dd000000-1111-1111-1111-dd0000000000'::uuid) INTO result;
            ASSERT (result::jsonb)->>'eligible' IS NOT NULL, 'AUTH-6 FAILED: ' || result::text;
            RAISE NOTICE 'AUTH-6 PASSED: self eligibility check works';
          END $$;

          -- DEL-1: Active jobs block internal deletion
          DO $$

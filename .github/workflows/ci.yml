            UPDATE profiles SET status = 'active' WHERE id = (SELECT id FROM auth.users LIMIT 1);
            RAISE NOTICE 'DEL-DB-1 PASSED: active accepted';
          EXCEPTION WHEN check_violation THEN
            RAISE EXCEPTION 'DEL-DB-1 FAILED: active rejected by constraint';
          END $$;

          DO $$
          DECLARE v_id UUID;
          BEGIN

          BEGIN
            -- Simulate auth.users deletion (remove the row)
            DELETE FROM auth.users WHERE id = 'dd000000-1111-1111-1111-dd0000000000'::uuid;
            SELECT _internal_finalize_deletion('dd000000-1111-1111-1111-dd0000000000'::uuid) INTO result;
            ASSERT (result::jsonb)->>'success' = 'true', 'DEL-4 FAILED: ' || result::text;
            SELECT status INTO v_status FROM profiles WHERE id = 'dd000000-1111-1111-1111-dd0000000000'::uuid;
            ASSERT v_status = 'deleted', 'DEL-4 FAILED: status not deleted';

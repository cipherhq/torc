            'dddddddd-0000-0000-0000-ffffffffffff'::uuid, 'dddddddd-0000-0000-0000-111111111111'::uuid
          );
          DELETE FROM notifications WHERE user_id IN ('dddddddd-1111-1111-1111-dddddddddddd'::uuid, 'dddddddd-2222-2222-2222-dddddddddddd'::uuid, 'dddddddd-3333-3333-3333-dddddddddddd'::uuid);
          DELETE FROM provider_earnings WHERE job_id IN (SELECT id FROM jobs WHERE customer_id = 'dddddddd-1111-1111-1111-dddddddddddd'::uuid);
          DELETE FROM jobs WHERE customer_id = 'dddddddd-1111-1111-1111-dddddddddddd'::uuid;
          DELETE FROM provider_profiles WHERE id IN ('dddddddd-2222-2222-2222-dddddddddddd'::uuid, 'dddddddd-3333-3333-3333-dddddddddddd'::uuid);
          DELETE FROM profiles WHERE id IN ('dddddddd-1111-1111-1111-dddddddddddd'::uuid, 'dddddddd-2222-2222-2222-dddddddddddd'::uuid, 'dddddddd-3333-3333-3333-dddddddddddd'::uuid);
          DELETE FROM services WHERE id = 'test-svc-match';
          DELETE FROM auth.users WHERE id IN ('dddddddd-1111-1111-1111-dddddddddddd'::uuid, 'dddddddd-2222-2222-2222-dddddddddddd'::uuid, 'dddddddd-3333-3333-3333-dddddddddddd'::uuid);
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $$ SELECT gen_random_uuid(); $$;

          DO $$ BEGIN RAISE NOTICE 'All 17 MATCH-001 sequential acceptance tests passed.'; END $$;

            IF v_id IS NULL THEN
              INSERT INTO auth.users (id, email) VALUES ('22222222-aaaa-aaaa-aaaa-222222222222'::uuid, 'del-test@test.com');
              INSERT INTO profiles (id, role, status) VALUES ('22222222-aaaa-aaaa-aaaa-222222222222'::uuid, 'customer', 'active');
              v_id := '22222222-aaaa-aaaa-aaaa-222222222222'::uuid;
            END IF;
            UPDATE profiles SET status = 'suspended' WHERE id = v_id;
            RAISE NOTICE 'DEL-DB-2 PASSED: suspended accepted';
            UPDATE profiles SET status = 'pending' WHERE id = v_id;
            RAISE NOTICE 'DEL-DB-3 PASSED: pending accepted';
            UPDATE profiles SET status = 'pending_deletion' WHERE id = v_id;
            RAISE NOTICE 'DEL-DB-4 PASSED: pending_deletion accepted';
            UPDATE profiles SET status = 'deleted' WHERE id = v_id;
            RAISE NOTICE 'DEL-DB-5 PASSED: deleted accepted';

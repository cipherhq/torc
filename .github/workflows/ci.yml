          CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'eeeeeeee-2222-2222-2222-eeeeeeeeeeee'::uuid; $fn$;
          SQL

          # MATCH-DB-13: Same provider, two jobs, concurrent sessions
          # Session 1: accept job A with transaction held open
          psql "$DB" -v ON_ERROR_STOP=1 <<'SQL' &
          BEGIN;
          SET LOCAL role TO 'authenticated';
          SELECT accept_job('eeeeeeee-0000-0000-0000-aaaaaaaaaaaa'::uuid, 'eeeeeeee-2222-2222-2222-eeeeeeeeeeee'::uuid);
          SELECT pg_sleep(2);
          COMMIT;

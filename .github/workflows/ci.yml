            ASSERT (result::jsonb)->>'error' = 'AUTH_NOT_DELETED', 'DEL-3 FAILED: ' || result::text;
            RAISE NOTICE 'DEL-3 PASSED: finalizer refuses while auth.users exists';
          END $$;

          -- DEL-4: after auth.users deletion, finalizer marks deleted
          DO $$

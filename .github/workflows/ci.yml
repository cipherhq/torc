            ('bbbbbbbb-3333-3333-3333-bbbbbbbbbbbb'::uuid, 'rt-unrelated@test.com')
          ON CONFLICT DO NOTHING;
          INSERT INTO services (id, name, base_price) VALUES ('test-svc-rt', 'RT Test', 50) ON CONFLICT DO NOTHING;
          INSERT INTO jobs (id, customer_id, provider_id, service_id, status, payment_status, created_at)
          VALUES ('bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa'::uuid, 'bbbbbbbb-1111-1111-1111-bbbbbbbbbbbb'::uuid,
                  'bbbbbbbb-2222-2222-2222-bbbbbbbbbbbb'::uuid, 'test-svc-rt', 'accepted', 'paid', now());

          -- RT-1: Policies exist on realtime.messages
          DO $$
          DECLARE v_count INT;
          BEGIN
            SELECT count(*) INTO v_count FROM pg_policy WHERE polrelid = 'realtime.messages'::regclass;
            ASSERT v_count >= 2, 'RT-1 FAILED: expected at least 2 policies on realtime.messages, got ' || v_count;
            RAISE NOTICE 'RT-1 PASSED: % policies exist on realtime.messages', v_count;
          END $$;

          -- RT-2: Policies are scoped to job-tracking topics (check policy text)
          DO $$
          DECLARE v_count INT;
          BEGIN
            SELECT count(*) INTO v_count FROM pg_policy
            WHERE polrelid = 'realtime.messages'::regclass
              AND (pg_get_expr(polqual, polrelid) LIKE '%job-tracking-%'
                   OR pg_get_expr(polwithcheck, polrelid) LIKE '%job-tracking-%');
            ASSERT v_count >= 2, 'RT-2 FAILED: policies must reference job-tracking topic';
            RAISE NOTICE 'RT-2 PASSED: % policies scoped to job-tracking topics', v_count;
          END $$;

          -- RT-3: Customer can access their own job tracking topic (SELECT)
          DO $$
          DECLARE v_allowed BOOLEAN;
          BEGIN
            SET LOCAL role TO 'authenticated';
            -- Simulate auth.uid() returning the customer
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'bbbbbbbb-1111-1111-1111-bbbbbbbbbbbb'::uuid; $fn$;
            SET LOCAL "realtime.topic" = 'job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa';
            -- Test SELECT policy by evaluating the policy expression
            SELECT EXISTS (
              SELECT 1 FROM realtime.messages
              WHERE topic = 'job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa'
            ) INTO v_allowed;
            -- Even if no rows exist, the query succeeding without error means the policy allows access
            RAISE NOTICE 'RT-3 PASSED: customer can access own job tracking topic';
          END $$;

          -- RT-4: Provider can access their own job tracking topic (SELECT)
          DO $$
          BEGIN
            SET LOCAL role TO 'authenticated';
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'bbbbbbbb-2222-2222-2222-bbbbbbbbbbbb'::uuid; $fn$;
            SET LOCAL "realtime.topic" = 'job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa';
            PERFORM 1 FROM realtime.messages WHERE topic = 'job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa';
            RAISE NOTICE 'RT-4 PASSED: provider can access own job tracking topic';
          END $$;

          -- RT-5: Unrelated user CANNOT access another job tracking topic (SELECT returns no rows even if inserted)
          DO $$
          DECLARE v_count INT;
          BEGIN
            SET LOCAL role TO 'authenticated';
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'bbbbbbbb-3333-3333-3333-bbbbbbbbbbbb'::uuid; $fn$;
            SET LOCAL "realtime.topic" = 'job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa';
            -- Insert a message as postgres (bypasses RLS)
            SET LOCAL role TO 'postgres';
            INSERT INTO realtime.messages (topic, extension, payload, event, private)
            VALUES ('job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa', 'broadcast', '{}', 'location_update', true);
            -- Switch to unrelated user and try to read
            SET LOCAL role TO 'authenticated';
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'bbbbbbbb-3333-3333-3333-bbbbbbbbbbbb'::uuid; $fn$;
            SELECT count(*) INTO v_count FROM realtime.messages
            WHERE topic = 'job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa';
            ASSERT v_count = 0, 'RT-5 FAILED: unrelated user must not read tracking messages, got ' || v_count;
            RAISE NOTICE 'RT-5 PASSED: unrelated user denied access to tracking messages';
          END $$;

          -- RT-6: Anonymous role CANNOT access tracking (anon has no grants on realtime)
          DO $$
          BEGIN
            SET LOCAL role TO 'anon';
            BEGIN
              PERFORM 1 FROM realtime.messages WHERE topic = 'job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa';
              RAISE EXCEPTION 'RT-6 FAILED: anon must be denied';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'RT-6 PASSED: anon denied access to realtime.messages';
            END;
          END $$;

          -- RT-7: Malformed topic fails closed (not a valid UUID)
          DO $$
          DECLARE v_count INT;
          BEGIN
            SET LOCAL role TO 'authenticated';
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'bbbbbbbb-1111-1111-1111-bbbbbbbbbbbb'::uuid; $fn$;
            SET LOCAL "realtime.topic" = 'job-tracking-not-a-valid-uuid';
            SELECT count(*) INTO v_count FROM realtime.messages WHERE topic = 'job-tracking-not-a-valid-uuid';
            ASSERT v_count = 0, 'RT-7 FAILED: malformed topic must fail closed';
            RAISE NOTICE 'RT-7 PASSED: malformed topic fails closed';
          END $$;

          -- RT-8: Completed job denies new tracking access
          DO $$
          DECLARE v_count INT;
          BEGIN
            -- Create a completed job
            SET LOCAL role TO 'postgres';
            INSERT INTO jobs (id, customer_id, provider_id, service_id, status, payment_status, created_at)
            VALUES ('bbbbbbbb-0000-0000-0000-cccccccccccc'::uuid, 'bbbbbbbb-1111-1111-1111-bbbbbbbbbbbb'::uuid,
                    'bbbbbbbb-2222-2222-2222-bbbbbbbbbbbb'::uuid, 'test-svc-rt', 'completed', 'paid', now());
            INSERT INTO realtime.messages (topic, extension, payload, event, private)
            VALUES ('job-tracking-bbbbbbbb-0000-0000-0000-cccccccccccc', 'broadcast', '{}', 'location_update', true);
            SET LOCAL role TO 'authenticated';
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'bbbbbbbb-1111-1111-1111-bbbbbbbbbbbb'::uuid; $fn$;
            SET LOCAL "realtime.topic" = 'job-tracking-bbbbbbbb-0000-0000-0000-cccccccccccc';
            SELECT count(*) INTO v_count FROM realtime.messages
            WHERE topic = 'job-tracking-bbbbbbbb-0000-0000-0000-cccccccccccc';
            ASSERT v_count = 0, 'RT-8 FAILED: completed job must deny tracking, got ' || v_count;
            RAISE NOTICE 'RT-8 PASSED: completed job denies tracking access';
          END $$;

          -- RT-9: Cancelled job denies new tracking access
          DO $$
          DECLARE v_count INT;
          BEGIN
            SET LOCAL role TO 'postgres';
            INSERT INTO jobs (id, customer_id, provider_id, service_id, status, payment_status, created_at)
            VALUES ('bbbbbbbb-0000-0000-0000-dddddddddddd'::uuid, 'bbbbbbbb-1111-1111-1111-bbbbbbbbbbbb'::uuid,
                    'bbbbbbbb-2222-2222-2222-bbbbbbbbbbbb'::uuid, 'test-svc-rt', 'cancelled', 'paid', now());
            INSERT INTO realtime.messages (topic, extension, payload, event, private)
            VALUES ('job-tracking-bbbbbbbb-0000-0000-0000-dddddddddddd', 'broadcast', '{}', 'location_update', true);
            SET LOCAL role TO 'authenticated';
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'bbbbbbbb-1111-1111-1111-bbbbbbbbbbbb'::uuid; $fn$;
            SET LOCAL "realtime.topic" = 'job-tracking-bbbbbbbb-0000-0000-0000-dddddddddddd';
            SELECT count(*) INTO v_count FROM realtime.messages
            WHERE topic = 'job-tracking-bbbbbbbb-0000-0000-0000-dddddddddddd';
            ASSERT v_count = 0, 'RT-9 FAILED: cancelled job must deny tracking';
            RAISE NOTICE 'RT-9 PASSED: cancelled job denies tracking access';
          END $$;

          -- RT-10: INSERT policy blocks unrelated user from sending
          DO $$
          BEGIN
            SET LOCAL role TO 'authenticated';
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'bbbbbbbb-3333-3333-3333-bbbbbbbbbbbb'::uuid; $fn$;
            SET LOCAL "realtime.topic" = 'job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa';
            BEGIN
              INSERT INTO realtime.messages (topic, extension, payload, event, private)
              VALUES ('job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa', 'broadcast', '{"lat":0}', 'location_update', true);
              RAISE EXCEPTION 'RT-10 FAILED: unrelated user must not INSERT tracking messages';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'RT-10 PASSED: unrelated user denied INSERT on tracking messages';
            WHEN check_violation THEN
              RAISE NOTICE 'RT-10 PASSED: unrelated user denied INSERT via WITH CHECK';
            WHEN OTHERS THEN
              -- RLS violation may raise different error codes
              RAISE NOTICE 'RT-10 PASSED: unrelated user denied INSERT (% : %)', SQLSTATE, SQLERRM;
            END;
          END $$;

          -- RT-11: Customer CAN insert on their own active job
          DO $$
          BEGIN
            SET LOCAL role TO 'authenticated';
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'bbbbbbbb-1111-1111-1111-bbbbbbbbbbbb'::uuid; $fn$;
            SET LOCAL "realtime.topic" = 'job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa';
            INSERT INTO realtime.messages (topic, extension, payload, event, private)
            VALUES ('job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa', 'broadcast', '{"lat":1}', 'location_update', true);
            RAISE NOTICE 'RT-11 PASSED: customer can INSERT on own active job tracking';
          END $$;

          -- Cleanup
          DELETE FROM realtime.messages;
          DELETE FROM jobs WHERE id IN (
            'bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa'::uuid,
            'bbbbbbbb-0000-0000-0000-cccccccccccc'::uuid,
            'bbbbbbbb-0000-0000-0000-dddddddddddd'::uuid
          );
          DELETE FROM services WHERE id = 'test-svc-rt';
          DELETE FROM auth.users WHERE id IN (
            'bbbbbbbb-1111-1111-1111-bbbbbbbbbbbb'::uuid,
            'bbbbbbbb-2222-2222-2222-bbbbbbbbbbbb'::uuid,
            'bbbbbbbb-3333-3333-3333-bbbbbbbbbbbb'::uuid
          );

          -- Restore auth.uid() to default
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $$ SELECT gen_random_uuid(); $$;

          DO $$ BEGIN RAISE NOTICE 'All 11 Realtime tracking authorization tests passed.'; END $$;
          SQL
      - name: Test claim-token ownership RPCs
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/torc_test" -v ON_ERROR_STOP=1 <<'SQL'
          -- Test 1: First claim returns a UUID token
          DO $$
          DECLARE v_token1 UUID; v_token2 UUID;
          BEGIN
            v_token1 := claim_notification_delivery('test:concurrent', 'email', 'test');
            ASSERT v_token1 IS NOT NULL, 'First claim must return a token';

            -- Test 2: Active lease — second caller gets NULL
            v_token2 := claim_notification_delivery('test:concurrent', 'email', 'test');
            ASSERT v_token2 IS NULL, 'Active lease must return NULL';

            -- Test 3: Stale worker rejection — mark with wrong token
            DECLARE v_ok BOOLEAN;
            BEGIN
              v_ok := mark_notification_delivery('test:concurrent', gen_random_uuid(), 'sent');
              ASSERT v_ok = false, 'Wrong token must return false';
            END;

            -- Test 4: Correct token mark succeeds
            DECLARE v_ok BOOLEAN;
            BEGIN
              v_ok := mark_notification_delivery('test:concurrent', v_token1, 'sent');
              ASSERT v_ok = true, 'Correct token must return true';
            END;

            -- Test 5: Sent permanence — future claim returns NULL
            v_token2 := claim_notification_delivery('test:concurrent', 'email', 'test');
            ASSERT v_token2 IS NULL, 'Sent event must never be reclaimable';

            -- Test 6: Failed retry
            DECLARE v_tokenA UUID; v_tokenB UUID;
            BEGIN
              v_tokenA := claim_notification_delivery('test:retry', 'sms', 'test');
              ASSERT v_tokenA IS NOT NULL, 'Retry claim A must return token';
              PERFORM mark_notification_delivery('test:retry', v_tokenA, 'failed');
              v_tokenB := claim_notification_delivery('test:retry', 'sms', 'test');
              ASSERT v_tokenB IS NOT NULL, 'Retry after failure must return token';
              ASSERT v_tokenB != v_tokenA, 'Retry must get NEW token';
            END;

            -- Test 7: Stale reclaim with expired lease
            DECLARE v_tokenC UUID; v_tokenD UUID;
            BEGIN
              v_tokenC := claim_notification_delivery('test:stale', 'email', 'test');
              ASSERT v_tokenC IS NOT NULL;
              -- Manually expire the lease
              UPDATE notification_delivery_log
                SET lease_expires_at = now() - interval '1 minute'
                WHERE event_key = 'test:stale';
              v_tokenD := claim_notification_delivery('test:stale', 'email', 'test');
              ASSERT v_tokenD IS NOT NULL, 'Stale reclaim must return new token';
              ASSERT v_tokenD != v_tokenC, 'Stale reclaim token must differ';
              -- Old token mark must fail
              DECLARE v_old_ok BOOLEAN;
              BEGIN
                v_old_ok := mark_notification_delivery('test:stale', v_tokenC, 'sent');
                ASSERT v_old_ok = false, 'Old token must be rejected';
              END;
              -- New token mark must succeed
              DECLARE v_new_ok BOOLEAN;
              BEGIN
                v_new_ok := mark_notification_delivery('test:stale', v_tokenD, 'sent');
                ASSERT v_new_ok = true, 'New token must succeed';
              END;
            END;

            -- Cleanup
            DELETE FROM notification_delivery_log WHERE event_key LIKE 'test:%';
            RAISE NOTICE 'All claim-token ownership tests passed.';
          END;
          $$;
          SQL

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets in source code
        run: |
          set -euo pipefail
          FOUND=0
          for pattern in 'sk_live_[a-zA-Z0-9]{10,}' 'eyJhbGci[a-zA-Z0-9_=-]{20,}'; do
            MATCHES=$(grep -rnE "$pattern" apps/ packages/ supabase/functions/ \
              --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" \
              | grep -v node_modules | grep -v '.test.' | grep -v 'pk_test_placeholder' || true)
            if [ -n "$MATCHES" ]; then
              echo "ERROR: Secret pattern '$pattern' found:"
              echo "$MATCHES"
              FOUND=1
            fi
          done
          if find . -name '.env' -not -name '.env.example' -not -path '*/node_modules/*' | grep -q .; then
            echo "ERROR: .env file found in repository"
            FOUND=1
          fi
          if [ "$FOUND" -eq 1 ]; then
            echo "FAILED: Secrets or .env files detected"
            exit 1
          fi
          echo "Security scan passed."

  edge-function-check:
    name: Edge Function Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x
      - name: Check send-email compiles
        run: deno check supabase/functions/send-email/index.ts
      - name: Check send-sms compiles
        run: deno check supabase/functions/send-sms/index.ts
      - name: Check create-payment-intent compiles
        run: deno check supabase/functions/create-payment-intent/index.ts
      - name: Check stripe-webhook compiles
        run: deno check supabase/functions/stripe-webhook/index.ts
      - name: Check expire-pending-jobs compiles
        run: deno check supabase/functions/expire-pending-jobs/index.ts

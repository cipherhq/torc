          BEGIN
            INSERT INTO jobs (id, customer_id, provider_id, service_id, status, payment_status, created_at)
            VALUES ('bbbbbbbb-0000-0000-0000-cccccccccccc'::uuid, 'bbbbbbbb-1111-1111-1111-bbbbbbbbbbbb'::uuid,
                    'bbbbbbbb-2222-2222-2222-bbbbbbbbbbbb'::uuid, 'test-svc-rt', 'completed', 'paid', now());
            INSERT INTO realtime.messages (topic, extension, payload, event, private)

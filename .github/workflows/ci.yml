            SELECT count(*) INTO v_count FROM realtime.messages
            WHERE topic = 'job-tracking-bbbbbbbb-0000-0000-0000-cccccccccccc';
            ASSERT v_count = 0, 'RT-9 FAILED: completed job must deny tracking';
            RAISE NOTICE 'RT-9 PASSED: completed job denies tracking';
          END $$;

          -- RT-10: Cancelled job denies tracking
          DO $$
          DECLARE v_count INT;
          BEGIN
            INSERT INTO jobs (id, customer_id, provider_id, service_id, status, payment_status, created_at)
            VALUES ('bbbbbbbb-0000-0000-0000-dddddddddddd'::uuid, 'bbbbbbbb-1111-1111-1111-bbbbbbbbbbbb'::uuid,
                    'bbbbbbbb-2222-2222-2222-bbbbbbbbbbbb'::uuid, 'test-svc-rt', 'cancelled', 'paid', now());
            INSERT INTO realtime.messages (topic, extension, payload, event, private)
            VALUES ('job-tracking-bbbbbbbb-0000-0000-0000-dddddddddddd', 'broadcast', '{}', 'test', true);
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'bbbbbbbb-1111-1111-1111-bbbbbbbbbbbb'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            SET LOCAL "realtime.topic" = 'job-tracking-bbbbbbbb-0000-0000-0000-dddddddddddd';
            SELECT count(*) INTO v_count FROM realtime.messages
            WHERE topic = 'job-tracking-bbbbbbbb-0000-0000-0000-dddddddddddd';
            ASSERT v_count = 0, 'RT-10 FAILED: cancelled job must deny tracking';
            RAISE NOTICE 'RT-10 PASSED: cancelled job denies tracking';
          END $$;

          -- RT-11: Unrelated user CANNOT INSERT tracking messages (RLS WITH CHECK)
          DO $$
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'bbbbbbbb-3333-3333-3333-bbbbbbbbbbbb'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            BEGIN

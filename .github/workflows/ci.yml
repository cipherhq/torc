              'finalize_expiry_refund',
              'finalize_expiry_no_refund',
              'reconcile_pending_refunds'
            ] LOOP
              SELECT EXISTS(SELECT 1 FROM information_schema.routine_privileges WHERE routine_name = v_fn AND routine_schema = 'public' AND grantee = 'PUBLIC') INTO v_has_public;
              SELECT EXISTS(SELECT 1 FROM information_schema.routine_privileges WHERE routine_name = v_fn AND routine_schema = 'public' AND grantee = 'anon') INTO v_has_anon;
              SELECT EXISTS(SELECT 1 FROM information_schema.routine_privileges WHERE routine_name = v_fn AND routine_schema = 'public' AND grantee = 'authenticated') INTO v_has_authed;
              SELECT EXISTS(SELECT 1 FROM information_schema.routine_privileges WHERE routine_name = v_fn AND routine_schema = 'public' AND grantee = 'service_role') INTO v_has_service;

              ASSERT v_has_public = false, 'Test 22 FAILED: ' || v_fn || ' must not be executable by PUBLIC';
              ASSERT v_has_anon = false, 'Test 22 FAILED: ' || v_fn || ' must not be executable by anon';
              ASSERT v_has_authed = false, 'Test 22 FAILED: ' || v_fn || ' must not be executable by authenticated';
              ASSERT v_has_service = true, 'Test 22 FAILED: ' || v_fn || ' must be executable by service_role';
            END LOOP;
            RAISE NOTICE 'Test 22 PASSED: All 5 expiry RPCs have correct privilege boundary';
          END $$;

          -- Test 23: anon cannot execute claim_expiry_eligible_jobs
          DO $$
          BEGIN
            SET LOCAL role TO 'anon';
            BEGIN
              PERFORM claim_expiry_eligible_jobs(0);
              RAISE EXCEPTION 'Test 23 FAILED: anon must not execute claim_expiry_eligible_jobs';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'Test 23 PASSED: anon rejected from claim_expiry_eligible_jobs';
            END;
          END $$;

          -- Test 24: authenticated cannot execute claim_expiry_eligible_jobs
          DO $$
          BEGIN
            SET LOCAL role TO 'authenticated';
            BEGIN
              PERFORM claim_expiry_eligible_jobs(0);
              RAISE EXCEPTION 'Test 24 FAILED: authenticated must not execute claim_expiry_eligible_jobs';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'Test 24 PASSED: authenticated rejected from claim_expiry_eligible_jobs';
            END;
          END $$;

          -- Test 25: service_role can execute claim_expiry_eligible_jobs(0) without JWT-GUC
          DO $$
          DECLARE v JSONB;
          BEGIN
            SET LOCAL role TO 'service_role';
            -- Do NOT set request.jwt.claim.role — that is the whole point
            SELECT claim_expiry_eligible_jobs(0)::jsonb INTO v;
            ASSERT v = '[]'::jsonb, 'Test 25 FAILED: batch_size=0 must return empty array, got: ' || v::text;
            RAISE NOTICE 'Test 25 PASSED: service_role executes claim_expiry_eligible_jobs(0) = [] without JWT-GUC';
          END $$;

          -- Test 26: anon cannot execute begin_expiry_refund_request
          DO $$
          BEGIN
            SET LOCAL role TO 'anon';

            ASSERT (result::jsonb)->>'error' = 'OPERATION_NOT_FOUND', 'Test 29 FAILED: expected OPERATION_NOT_FOUND';
            RAISE NOTICE 'Test 29 PASSED: service_role executes finalize_expiry_refund without JWT-GUC';

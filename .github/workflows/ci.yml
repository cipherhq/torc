            INSERT INTO profiles (id, role, status) VALUES ('22222222-cccc-cccc-cccc-222222222222'::uuid, 'provider', 'active') ON CONFLICT DO NOTHING;
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT '22222222-cccc-cccc-cccc-222222222222'::uuid; $fn$;

          -- ============================================================
          DO $$
          DECLARE v JSONB; op_id UUID; ct UUID; result JSON; job_status TEXT;
          BEGIN
            INSERT INTO jobs (id, customer_id, service_id, status, payment_status, created_at, checkout_id)
            VALUES ('aaaaaaaa-0000-0000-0000-eeee00000020'::uuid, 'aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa'::uuid,
                    'test-svc-expiry', 'pending', 'unpaid', now() - interval '3 hours',
                    'aaaaaaaa-0000-0000-0000-cccc00000020'::uuid);
            INSERT INTO checkouts (id, user_id, service_id, base_price, total_amount, currency, status)
            VALUES ('aaaaaaaa-0000-0000-0000-cccc00000020'::uuid, 'aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa'::uuid,
                    'test-svc-expiry', 50, 54, 'USD', 'pending');
            SET LOCAL "request.jwt.claim.role" = 'service_role';
            SET LOCAL role TO 'postgres';
            SELECT claim_expiry_eligible_jobs(10)::jsonb INTO v;

          -- ============================================================
          -- Test 19: Checkout with payment_intent_id → no-refund rejected
          -- ============================================================
          DO $$
          DECLARE v JSONB; op_id UUID; ct UUID; result JSON;
          BEGIN
            INSERT INTO jobs (id, customer_id, service_id, status, payment_status, created_at, checkout_id)
            VALUES ('aaaaaaaa-0000-0000-0000-eeee00000019'::uuid, 'aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa'::uuid,

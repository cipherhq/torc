            UPDATE profiles SET status = 'active' WHERE id = v_id;
          END $$;

          -- DEL-DB-6: Rejects invalid state
          DO $$
          DECLARE v_id UUID;
          BEGIN
            SELECT id INTO v_id FROM profiles LIMIT 1;

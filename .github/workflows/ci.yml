name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Clean install (frozen lockfile)
        run: npm ci

  unit-tests:
    name: Unit Tests
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run customer-web tests
        run: npm run test --workspace=apps/customer-web
        env:
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Run provider-web tests
        run: npm run test --workspace=apps/provider-web
        env:
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Run admin-web tests
        run: npm run test --workspace=apps/admin-web
        env:
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key

  e2e-tests:
    name: E2E Tests (Playwright)
    needs: install
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://test.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        run: npx playwright test --reporter=list

  build:
    name: Build All Apps
    needs: install
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer-web, provider-web, admin-web, website]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build ${{ matrix.app }}
        run: npm run build --workspace=apps/${{ matrix.app }}
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-key
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          VITE_GOOGLE_MAPS_API_KEY: placeholder
          VITE_APP_URL: https://torcapp.com

  migration-validation:
    name: Validate Migrations (Ephemeral Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: torc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create auth schema stub
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/torc_test" <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            email TEXT
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $$ SELECT gen_random_uuid(); $$;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
          GRANT ALL ON ALL TABLES IN SCHEMA public TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated, service_role;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA auth TO anon, authenticated, service_role;
          SQL
      - name: Create realtime schema stub
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/torc_test" <<'SQL'
          CREATE SCHEMA IF NOT EXISTS realtime;
          CREATE TABLE IF NOT EXISTS realtime.messages (
            id UUID DEFAULT gen_random_uuid(),
            topic TEXT NOT NULL,
            extension TEXT NOT NULL DEFAULT 'broadcast',
            payload JSONB,
            event TEXT,
            private BOOLEAN DEFAULT false,
            updated_at TIMESTAMP DEFAULT now(),
            inserted_at TIMESTAMP DEFAULT now(),
            binary_payload BYTEA,
            PRIMARY KEY (id, inserted_at)
          ) PARTITION BY RANGE (inserted_at);
          -- Create a default partition for testing
          CREATE TABLE IF NOT EXISTS realtime.messages_default PARTITION OF realtime.messages DEFAULT;
          -- Stub realtime.topic() — returns the topic from current_setting
          CREATE OR REPLACE FUNCTION realtime.topic() RETURNS TEXT LANGUAGE sql STABLE AS $$
            SELECT current_setting('realtime.topic', true);
          $$;
          GRANT USAGE ON SCHEMA realtime TO authenticated, service_role;
          GRANT ALL ON ALL TABLES IN SCHEMA realtime TO authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA realtime GRANT ALL ON TABLES TO authenticated, service_role;
          SQL
      - name: Create prerequisite tables
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/torc_test" <<'SQL'
          CREATE TABLE IF NOT EXISTS public.profiles (
            id UUID PRIMARY KEY REFERENCES auth.users(id),
            role TEXT,
            email TEXT,
            first_name TEXT,
            last_name TEXT,
            phone TEXT,
            status TEXT DEFAULT 'active',
            suspended_at TIMESTAMPTZ
          );
          CREATE TABLE IF NOT EXISTS public.services (
            id TEXT PRIMARY KEY,
            name TEXT,
            base_price NUMERIC(10,2) DEFAULT 0
          );
          CREATE TABLE IF NOT EXISTS public.jobs (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            customer_id UUID,
            provider_id UUID,
            service_id TEXT REFERENCES public.services(id),
            status TEXT DEFAULT 'pending',
            payment_status TEXT DEFAULT 'unpaid',
            payment_intent_id TEXT,
            paid_at TIMESTAMPTZ,
            created_at TIMESTAMPTZ DEFAULT now(),
            updated_at TIMESTAMPTZ DEFAULT now(),
            accepted_at TIMESTAMPTZ,
            started_at TIMESTAMPTZ,
            completed_at TIMESTAMPTZ,
            cancelled_at TIMESTAMPTZ,
            cancelled_by UUID,
            cancellation_reason TEXT,
            customer_completed_at TIMESTAMPTZ,
            scheduled_for TIMESTAMPTZ,
            checkout_id UUID,
            rating INTEGER,
            review TEXT,
            tip NUMERIC(10,2),
            provider_photo_urls TEXT[]
          );
          ALTER TABLE public.jobs ENABLE ROW LEVEL SECURITY;
          -- Minimal jobs RLS matching production (participants can read/update own jobs)
          CREATE POLICY "Users can view own jobs" ON public.jobs FOR SELECT
            USING (auth.uid() = customer_id OR auth.uid() = provider_id);
          CREATE POLICY "Providers can view pending jobs" ON public.jobs FOR SELECT
            USING (status = 'pending' AND provider_id IS NULL);
          CREATE POLICY "Involved users can update jobs" ON public.jobs FOR UPDATE
            USING (auth.uid() = customer_id OR auth.uid() = provider_id);
          CREATE POLICY "Customers can create jobs" ON public.jobs FOR INSERT
            WITH CHECK (auth.uid() = customer_id);
          -- Lifecycle timestamp trigger (from database/migrations/027)
          CREATE OR REPLACE FUNCTION public.apply_job_status_timestamps()
          RETURNS trigger LANGUAGE plpgsql SECURITY DEFINER SET search_path = public AS $$
          BEGIN
            IF NEW.status IS DISTINCT FROM OLD.status THEN
              IF NEW.status = 'accepted' AND NEW.accepted_at IS NULL THEN
                NEW.accepted_at = COALESCE(OLD.accepted_at, now());
              END IF;
              IF NEW.status IN ('in_progress', 'inprogress') AND NEW.started_at IS NULL THEN
                NEW.started_at = COALESCE(OLD.started_at, now());
              END IF;
              IF NEW.status = 'completed' THEN
                IF NEW.started_at IS NULL THEN
                  NEW.started_at = COALESCE(OLD.started_at, OLD.accepted_at, now());
                END IF;
                IF NEW.completed_at IS NULL THEN
                  NEW.completed_at = COALESCE(OLD.completed_at, now());
                END IF;
              END IF;
            END IF;
            RETURN NEW;
          END;
          $$;
          DROP TRIGGER IF EXISTS trg_jobs_apply_status_timestamps ON public.jobs;
          CREATE TRIGGER trg_jobs_apply_status_timestamps
            BEFORE UPDATE OF status ON public.jobs
            FOR EACH ROW
            WHEN (OLD.status IS DISTINCT FROM NEW.status)
            EXECUTE FUNCTION public.apply_job_status_timestamps();
          -- cancel_job stub (from supabase/migrations/20260312000146)
          CREATE OR REPLACE FUNCTION public.cancel_job(
            p_job_id UUID, p_actor_id UUID, p_actor_type TEXT, p_reason TEXT DEFAULT NULL
          ) RETURNS JSONB LANGUAGE plpgsql SECURITY DEFINER SET search_path = public AS $$
          DECLARE v_job RECORD;
          BEGIN
            IF p_actor_id != auth.uid() THEN
              RETURN jsonb_build_object('success', false, 'error', 'UNAUTHORIZED');
            END IF;
            SELECT * INTO v_job FROM jobs WHERE id = p_job_id FOR UPDATE;
            IF NOT FOUND THEN RETURN jsonb_build_object('success', false, 'error', 'NOT_FOUND'); END IF;
            IF v_job.status IN ('completed', 'cancelled') THEN
              RETURN jsonb_build_object('success', false, 'error', 'JOB_CANNOT_BE_CANCELLED');
            END IF;
            IF p_actor_type = 'customer' AND v_job.customer_id != p_actor_id THEN
              RETURN jsonb_build_object('success', false, 'error', 'UNAUTHORIZED');
            END IF;
            IF p_actor_type = 'provider' AND (v_job.provider_id IS NULL OR v_job.provider_id != p_actor_id) THEN
              RETURN jsonb_build_object('success', false, 'error', 'UNAUTHORIZED');
            END IF;
            UPDATE jobs SET status = 'cancelled', cancellation_reason = p_reason,
              cancelled_at = NOW(), cancelled_by = p_actor_id, updated_at = NOW()
            WHERE id = p_job_id;
            INSERT INTO job_events (job_id, event_type, actor_id, actor_type, metadata)
            VALUES (p_job_id, 'job_cancelled', p_actor_id, p_actor_type,
              jsonb_build_object('reason', p_reason, 'previous_status', v_job.status));
            RETURN jsonb_build_object('success', true, 'job_id', p_job_id, 'status', 'cancelled');
          END;
          $$;
          REVOKE EXECUTE ON FUNCTION public.cancel_job(UUID, UUID, TEXT, TEXT) FROM PUBLIC;
          REVOKE EXECUTE ON FUNCTION public.cancel_job(UUID, UUID, TEXT, TEXT) FROM anon;
          GRANT EXECUTE ON FUNCTION public.cancel_job(UUID, UUID, TEXT, TEXT) TO authenticated;
          CREATE TABLE IF NOT EXISTS public.job_events (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            job_id UUID NOT NULL,
            event_type TEXT NOT NULL,
            actor_id UUID,
            actor_type TEXT,
            metadata JSONB,
            created_at TIMESTAMPTZ DEFAULT now()
          );
          CREATE TABLE IF NOT EXISTS public.notifications (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            user_id UUID,
            job_id UUID,
            type TEXT,
            title TEXT,
            message TEXT,
            action_url TEXT,
            created_at TIMESTAMPTZ DEFAULT now()
          );
          CREATE TABLE IF NOT EXISTS public.provider_profiles (
            id UUID PRIMARY KEY REFERENCES auth.users(id),
            services TEXT[] DEFAULT '{}',
            is_verified BOOLEAN DEFAULT false,
            is_online BOOLEAN DEFAULT false,
            rating NUMERIC(3,2) DEFAULT 0,
            total_jobs INTEGER DEFAULT 0,
            total_earnings NUMERIC(10,2) DEFAULT 0,
            avatar_url TEXT,
            created_at TIMESTAMPTZ DEFAULT now()
          );
          ALTER TABLE public.provider_profiles ENABLE ROW LEVEL SECURITY;
          CREATE POLICY "Provider can view own profile" ON public.provider_profiles
            FOR SELECT USING (auth.uid() = id);
          CREATE POLICY "Anyone can view providers" ON public.provider_profiles
            FOR SELECT USING (auth.uid() IS NOT NULL);
          CREATE POLICY "Provider can update own profile" ON public.provider_profiles
            FOR UPDATE USING (auth.uid() = id);
          CREATE POLICY "Provider can insert own profile" ON public.provider_profiles
            FOR INSERT WITH CHECK (auth.uid() = id);
          -- is_admin helper (must be before Admin policy)
          CREATE OR REPLACE FUNCTION public.is_admin(user_id UUID) RETURNS BOOLEAN
            LANGUAGE sql STABLE SECURITY DEFINER SET search_path = public AS $$
            SELECT EXISTS (SELECT 1 FROM public.profiles WHERE id = user_id AND role = 'admin');
          $$;
          CREATE POLICY "Admin full access provider_profiles" ON public.provider_profiles
            FOR ALL USING (is_admin(auth.uid()));
          CREATE TABLE IF NOT EXISTS public.provider_locations (
            provider_id UUID PRIMARY KEY REFERENCES auth.users(id),
            latitude DOUBLE PRECISION,
            longitude DOUBLE PRECISION,
            is_online BOOLEAN DEFAULT false,
            updated_at TIMESTAMPTZ DEFAULT now()
          );
          -- Ensure authenticated/service_role can access tables created above
          GRANT ALL ON ALL TABLES IN SCHEMA public TO anon, authenticated, service_role;
          SQL
      - name: Execute all new migrations in order
        run: |
          set -euo pipefail
          for f in supabase/migrations/20260804*.sql supabase/migrations/20260805*.sql supabase/migrations/20260806*.sql supabase/migrations/20260807*.sql supabase/migrations/20260808*.sql supabase/migrations/20260809*.sql supabase/migrations/20260810*.sql supabase/migrations/20260811*.sql; do
            echo "Executing: $f"
            psql "postgresql://postgres:postgres@localhost:5432/torc_test" -v ON_ERROR_STOP=1 -f "$f"
            echo "OK: $f"
          done
      - name: Grant post-migration table access
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/torc_test" <<'SQL'
          -- Ensure roles can access tables created by migrations (e.g. realtime.messages partitions)
          GRANT ALL ON ALL TABLES IN SCHEMA public TO anon, authenticated, service_role;
          GRANT ALL ON ALL TABLES IN SCHEMA realtime TO authenticated, service_role;
          GRANT USAGE ON SCHEMA realtime TO authenticated, service_role;
          SQL
      - name: Assert RLS and privilege restrictions
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/torc_test" -v ON_ERROR_STOP=1 <<'SQL'
          -- Assert checkouts has RLS enabled
          DO $$ BEGIN
            ASSERT (SELECT rowsecurity FROM pg_tables WHERE tablename = 'checkouts' AND schemaname = 'public'),
              'checkouts must have RLS enabled';
          END $$;

          -- Assert no UPDATE policy on checkouts for authenticated
          DO $$ BEGIN
            ASSERT NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE tablename = 'checkouts' AND schemaname = 'public'
              AND cmd = 'UPDATE'
              AND roles @> ARRAY['authenticated']::name[]
            ), 'checkouts must NOT have UPDATE policy for authenticated';
          END $$;

          -- Assert transition_job_status is NOT executable by authenticated
          DO $$ BEGIN
            ASSERT NOT EXISTS (
              SELECT 1 FROM information_schema.role_routine_grants
              WHERE routine_name = 'transition_job_status'
              AND grantee IN ('PUBLIC', 'authenticated')
            ), 'transition_job_status must not be executable by PUBLIC or authenticated';
          END $$;

          -- Assert expire_stale_jobs is NOT executable by authenticated
          DO $$ BEGIN
            ASSERT NOT EXISTS (
              SELECT 1 FROM information_schema.role_routine_grants
              WHERE routine_name = 'expire_stale_jobs'
              AND grantee IN ('PUBLIC', 'authenticated')
            ), 'expire_stale_jobs must not be executable by PUBLIC or authenticated';
          END $$;

          -- Assert processed_webhook_events has RLS blocking all access
          DO $$ BEGIN
            ASSERT (SELECT rowsecurity FROM pg_tables WHERE tablename = 'processed_webhook_events'),
              'processed_webhook_events must have RLS enabled';
          END $$;

          DO $$ BEGIN RAISE NOTICE 'All RLS and privilege assertions passed.'; END $$;
          SQL
      - name: Test expiry lifecycle RPCs
        run: |
          DB="postgresql://postgres:postgres@localhost:5432/torc_test"
          psql "$DB" -v ON_ERROR_STOP=1 <<'SQL'
          -- ============================================================
          -- Setup: Create test data used across all expiry lifecycle tests
          -- ============================================================
          INSERT INTO auth.users (id) VALUES
            ('aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa'::uuid),
            ('aaaaaaaa-2222-2222-2222-aaaaaaaaaaaa'::uuid)
          ON CONFLICT DO NOTHING;
          INSERT INTO services (id, name, base_price) VALUES ('test-svc-expiry', 'Test Expiry', 50)
          ON CONFLICT DO NOTHING;

          -- ============================================================
          -- Test 1: Future scheduled job NOT claimed
          -- ============================================================
          DO $$ DECLARE v JSONB; BEGIN
            INSERT INTO jobs (id, customer_id, service_id, status, payment_status, created_at, scheduled_for)
            VALUES ('aaaaaaaa-0000-0000-0000-eeee00000001'::uuid, 'aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa'::uuid,
                    'test-svc-expiry', 'pending', 'unpaid', now() - interval '3 hours', now() + interval '24 hours');
            SET LOCAL "request.jwt.claim.role" = 'service_role';
            SET LOCAL role TO 'postgres';
            SELECT claim_expiry_eligible_jobs(10)::jsonb INTO v;
            ASSERT jsonb_array_length(v) = 0, 'Test 1 FAILED: Future job must not be claimed';
            RAISE NOTICE 'Test 1 PASSED: Future scheduled job NOT claimed';
            DELETE FROM job_expiry_refund_operations WHERE job_id = 'aaaaaaaa-0000-0000-0000-eeee00000001'::uuid;
            DELETE FROM jobs WHERE id = 'aaaaaaaa-0000-0000-0000-eeee00000001'::uuid;
          END $$;

          -- ============================================================
          -- Test 2: Eligible on-demand job IS claimed
          -- ============================================================
          DO $$ DECLARE v JSONB; BEGIN
            INSERT INTO jobs (id, customer_id, service_id, status, payment_status, created_at)
            VALUES ('aaaaaaaa-0000-0000-0000-eeee00000002'::uuid, 'aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa'::uuid,
                    'test-svc-expiry', 'pending', 'unpaid', now() - interval '3 hours');
            SET LOCAL "request.jwt.claim.role" = 'service_role';
            SET LOCAL role TO 'postgres';
            SELECT claim_expiry_eligible_jobs(10)::jsonb INTO v;
            ASSERT jsonb_array_length(v) = 1, 'Test 2 FAILED: Eligible on-demand job must be claimed';
            RAISE NOTICE 'Test 2 PASSED: Eligible on-demand job IS claimed';
            DELETE FROM job_expiry_refund_operations WHERE job_id = 'aaaaaaaa-0000-0000-0000-eeee00000002'::uuid;
            DELETE FROM jobs WHERE id = 'aaaaaaaa-0000-0000-0000-eeee00000002'::uuid;
          END $$;

          -- ============================================================
          -- Test 3: Second claim same job returns no new operation
          -- ============================================================
          DO $$ DECLARE v1 JSONB; v2 JSONB; BEGIN
            INSERT INTO jobs (id, customer_id, service_id, status, payment_status, created_at)
            VALUES ('aaaaaaaa-0000-0000-0000-eeee00000003'::uuid, 'aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa'::uuid,
                    'test-svc-expiry', 'pending', 'unpaid', now() - interval '3 hours');
            SET LOCAL "request.jwt.claim.role" = 'service_role';
            SET LOCAL role TO 'postgres';
            SELECT claim_expiry_eligible_jobs(10)::jsonb INTO v1;
            ASSERT jsonb_array_length(v1) = 1, 'Test 3 FAILED: First claim must succeed';
            -- Second claim with active lease should return 0
            SELECT claim_expiry_eligible_jobs(10)::jsonb INTO v2;
            ASSERT jsonb_array_length(v2) = 0, 'Test 3 FAILED: Second claim must return 0 (active lease)';
            RAISE NOTICE 'Test 3 PASSED: Second claim same job returns no new operation';
            DELETE FROM job_expiry_refund_operations WHERE job_id = 'aaaaaaaa-0000-0000-0000-eeee00000003'::uuid;
            DELETE FROM jobs WHERE id = 'aaaaaaaa-0000-0000-0000-eeee00000003'::uuid;
          END $$;

          -- ============================================================
          -- Test 4: Assigned job is NOT claimed
          -- ============================================================
          DO $$ DECLARE v JSONB; BEGIN
            INSERT INTO jobs (id, customer_id, service_id, status, payment_status, created_at, provider_id)
            VALUES ('aaaaaaaa-0000-0000-0000-eeee00000004'::uuid, 'aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa'::uuid,
                    'test-svc-expiry', 'pending', 'unpaid', now() - interval '3 hours',
                    'aaaaaaaa-2222-2222-2222-aaaaaaaaaaaa'::uuid);
            SET LOCAL "request.jwt.claim.role" = 'service_role';
            SET LOCAL role TO 'postgres';
            SELECT claim_expiry_eligible_jobs(10)::jsonb INTO v;
            ASSERT jsonb_array_length(v) = 0, 'Test 4 FAILED: Assigned job must not be claimed';
            RAISE NOTICE 'Test 4 PASSED: Assigned job is NOT claimed';
            DELETE FROM jobs WHERE id = 'aaaaaaaa-0000-0000-0000-eeee00000004'::uuid;
          END $$;

          -- ============================================================
          -- Test 5: Accepted job is NOT claimed
          -- ============================================================
          DO $$ DECLARE v JSONB; BEGIN
            INSERT INTO jobs (id, customer_id, service_id, status, payment_status, created_at, provider_id)
            VALUES ('aaaaaaaa-0000-0000-0000-eeee00000005'::uuid, 'aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa'::uuid,
                    'test-svc-expiry', 'accepted', 'paid', now() - interval '3 hours',
                    'aaaaaaaa-2222-2222-2222-aaaaaaaaaaaa'::uuid);
            SET LOCAL "request.jwt.claim.role" = 'service_role';
            SET LOCAL role TO 'postgres';
            SELECT claim_expiry_eligible_jobs(10)::jsonb INTO v;
            ASSERT jsonb_array_length(v) = 0, 'Test 5 FAILED: Accepted job must not be claimed';
            RAISE NOTICE 'Test 5 PASSED: Accepted job is NOT claimed';
            DELETE FROM jobs WHERE id = 'aaaaaaaa-0000-0000-0000-eeee00000005'::uuid;
          END $$;

          -- ============================================================
          -- Test 6: Finalize with correct claim_token succeeds
          -- ============================================================
          DO $$
          DECLARE v JSONB; op_id UUID; ct UUID; result JSON;
          BEGIN
            INSERT INTO jobs (id, customer_id, service_id, status, payment_status, created_at)
            VALUES ('aaaaaaaa-0000-0000-0000-eeee00000006'::uuid, 'aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa'::uuid,
                    'test-svc-expiry', 'pending', 'unpaid', now() - interval '3 hours');
            SET LOCAL "request.jwt.claim.role" = 'service_role';
            SET LOCAL role TO 'postgres';
            SELECT claim_expiry_eligible_jobs(10)::jsonb INTO v;
            ASSERT jsonb_array_length(v) = 1, 'Test 6 setup: must claim 1 job';
            op_id := (v->0->>'operation_id')::uuid;
            ct := (v->0->>'claim_token')::uuid;
            SELECT finalize_expiry_no_refund(op_id, ct) INTO result;
            ASSERT (result::jsonb)->>'success' = 'true', 'Test 6 FAILED: finalize must succeed';
            RAISE NOTICE 'Test 6 PASSED: Finalize with correct claim_token succeeds';
            DELETE FROM job_expiry_refund_operations WHERE job_id = 'aaaaaaaa-0000-0000-0000-eeee00000006'::uuid;
            DELETE FROM jobs WHERE id = 'aaaaaaaa-0000-0000-0000-eeee00000006'::uuid;
          END $$;

          -- ============================================================
          -- Test 7: Finalize with wrong claim_token is rejected
          -- ============================================================
          DO $$
          DECLARE v JSONB; op_id UUID; result JSON;
          BEGIN
            INSERT INTO jobs (id, customer_id, service_id, status, payment_status, created_at)
            VALUES ('aaaaaaaa-0000-0000-0000-eeee00000007'::uuid, 'aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa'::uuid,
                    'test-svc-expiry', 'pending', 'unpaid', now() - interval '3 hours');
            SET LOCAL "request.jwt.claim.role" = 'service_role';
            SET LOCAL role TO 'postgres';
            SELECT claim_expiry_eligible_jobs(10)::jsonb INTO v;
            op_id := (v->0->>'operation_id')::uuid;
            -- Use a random UUID as wrong token
            SELECT finalize_expiry_no_refund(op_id, gen_random_uuid()) INTO result;
            ASSERT (result::jsonb)->>'success' = 'false', 'Test 7 FAILED: wrong token must be rejected';
            RAISE NOTICE 'Test 7 PASSED: Finalize with wrong claim_token is rejected';
            DELETE FROM job_expiry_refund_operations WHERE job_id = 'aaaaaaaa-0000-0000-0000-eeee00000007'::uuid;
            DELETE FROM jobs WHERE id = 'aaaaaaaa-0000-0000-0000-eeee00000007'::uuid;
          END $$;

          -- ============================================================
          -- Test 8: Duplicate finalization is idempotent
          -- ============================================================
          DO $$
          DECLARE v JSONB; op_id UUID; ct UUID; r1 JSON; r2 JSON;
          BEGIN
            INSERT INTO jobs (id, customer_id, service_id, status, payment_status, created_at)
            VALUES ('aaaaaaaa-0000-0000-0000-eeee00000008'::uuid, 'aaaaaaaa-1111-1111-1111-aaaaaaaaaaaa'::uuid,
                    'test-svc-expiry', 'pending', 'unpaid', now() - interval '3 hours');
            SET LOCAL "request.jwt.claim.role" = 'service_role';
            SET LOCAL role TO 'postgres';
            SELECT claim_expiry_eligible_jobs(10)::jsonb INTO v;
            op_id := (v->0->>'operation_id')::uuid;
            ct := (v->0->>'claim_token')::uuid;
            SELECT finalize_expiry_no_refund(op_id, ct) INTO r1;
            ASSERT (r1::jsonb)->>'success' = 'true', 'Test 8 setup: first finalize must succeed';
            -- Second finalize with same token
            SELECT finalize_expiry_no_refund(op_id, ct) INTO r2;

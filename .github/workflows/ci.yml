            ASSERT v_count = 0, 'RT-7 FAILED: wrong-length topic must fail closed';
            RAISE NOTICE 'RT-7 PASSED: wrong-length topic fails closed';
          END $$;

          -- RT-8: Correct-length invalid UUID fails closed WITHOUT exception
          DO $$
          DECLARE v_count INT;
          BEGIN
            -- zzzzzzzz-zzzz-zzzz-zzzz-zzzzzzzzzzzz is 36 chars, correct length, but not a valid UUID
            INSERT INTO realtime.messages (topic, extension, payload, event, private)
            VALUES ('job-tracking-zzzzzzzz-zzzz-zzzz-zzzz-zzzzzzzzzzzz', 'broadcast', '{}', 'test', true);
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'bbbbbbbb-1111-1111-1111-bbbbbbbbbbbb'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            SET LOCAL "realtime.topic" = 'job-tracking-zzzzzzzz-zzzz-zzzz-zzzz-zzzzzzzzzzzz';
            SELECT count(*) INTO v_count FROM realtime.messages
            WHERE topic = 'job-tracking-zzzzzzzz-zzzz-zzzz-zzzz-zzzzzzzzzzzz';
            ASSERT v_count = 0, 'RT-8 FAILED: invalid UUID must fail closed without exception';
            RAISE NOTICE 'RT-8 PASSED: correct-length invalid UUID fails closed';
          END $$;


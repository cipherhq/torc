name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --frozen-lockfile
      - name: Type check customer-web
        run: npx tsc --noEmit --project apps/customer-web/tsconfig.json 2>/dev/null || echo "No tsconfig found, skipping type check"
      - name: Type check provider-web
        run: npx tsc --noEmit --project apps/provider-web/tsconfig.json 2>/dev/null || echo "No tsconfig found, skipping type check"
      - name: Type check admin-web
        run: npx tsc --noEmit --project apps/admin-web/tsconfig.json 2>/dev/null || echo "No tsconfig found, skipping type check"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --frozen-lockfile
      - name: Run customer-web tests
        run: npx vitest run --config apps/customer-web/vite.config.js --reporter=verbose
        env:
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Run provider-web tests
        run: npx vitest run --config apps/provider-web/vite.config.js --reporter=verbose
        env:
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key
      - name: Run admin-web tests
        run: npx vitest run --config apps/admin-web/vite.config.js --reporter=verbose
        env:
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key

  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer-web, provider-web, admin-web, website]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --frozen-lockfile
      - name: Build ${{ matrix.app }}
        run: npm run build --workspace=apps/${{ matrix.app }}
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-key
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
          VITE_GOOGLE_MAPS_API_KEY: placeholder
          VITE_APP_URL: https://torcapp.com

  migration-validation:
    name: Validate Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration files are valid SQL
        run: |
          for f in database/migrations/*.sql supabase/migrations/*.sql; do
            if [ -f "$f" ]; then
              echo "Validating: $f"
              # Basic syntax check - ensure file is not empty and has SQL content
              if [ ! -s "$f" ]; then
                echo "ERROR: Empty migration file: $f"
                exit 1
              fi
            fi
          done
          echo "All migration files validated."

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets
        run: |
          # Check for common secret patterns in source code
          FOUND=0
          for pattern in 'sk_live_' 'sk_test_[a-zA-Z0-9]{20}' 'eyJhbGci'; do
            MATCHES=$(grep -rn "$pattern" apps/ packages/ supabase/functions/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" | grep -v node_modules | grep -v '.test.' | grep -v 'pk_test_placeholder' || true)
            if [ -n "$MATCHES" ]; then
              echo "WARNING: Possible secret pattern '$pattern' found:"
              echo "$MATCHES" | head -5
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo "Review the above matches for actual secrets."
          fi

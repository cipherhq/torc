            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'Test 26 PASSED: anon rejected from begin_expiry_refund_request';
            END;
          END $$;

          -- Test 27: service_role can execute begin_expiry_refund_request (NOT_FOUND is success)
          DO $$
          DECLARE result JSON;
          BEGIN
            SET LOCAL role TO 'service_role';
            SELECT begin_expiry_refund_request(gen_random_uuid(), gen_random_uuid()) INTO result;
            ASSERT (result::jsonb)->>'error' = 'NOT_FOUND', 'Test 27 FAILED: expected NOT_FOUND, got: ' || result::text;
            RAISE NOTICE 'Test 27 PASSED: service_role executes begin_expiry_refund_request without JWT-GUC';
          END $$;

          -- Test 28: anon cannot execute finalize_expiry_refund
          DO $$
          BEGIN
            SET LOCAL role TO 'anon';
            BEGIN
              PERFORM finalize_expiry_refund(gen_random_uuid(), gen_random_uuid());
              RAISE EXCEPTION 'Test 28 FAILED: anon must not execute finalize_expiry_refund';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'Test 28 PASSED: anon rejected from finalize_expiry_refund';
            END;
          END $$;

          -- Test 29: service_role can execute finalize_expiry_refund (OPERATION_NOT_FOUND is success)
          DO $$
          DECLARE result JSON;
          BEGIN
            SET LOCAL role TO 'service_role';
            SELECT finalize_expiry_refund(gen_random_uuid(), gen_random_uuid()) INTO result;
            ASSERT (result::jsonb)->>'error' = 'OPERATION_NOT_FOUND', 'Test 29 FAILED: expected OPERATION_NOT_FOUND';
            RAISE NOTICE 'Test 29 PASSED: service_role executes finalize_expiry_refund without JWT-GUC';
          END $$;

          -- Test 30: anon cannot execute finalize_expiry_no_refund
          DO $$
          BEGIN
            SET LOCAL role TO 'anon';
            BEGIN
              PERFORM finalize_expiry_no_refund(gen_random_uuid(), gen_random_uuid());
              RAISE EXCEPTION 'Test 30 FAILED: anon must not execute finalize_expiry_no_refund';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'Test 30 PASSED: anon rejected from finalize_expiry_no_refund';
            END;
          END $$;

          -- Test 31: service_role can execute finalize_expiry_no_refund (NOT_FOUND is success)
          DO $$
          DECLARE result JSON;
          BEGIN
            SET LOCAL role TO 'service_role';
            SELECT finalize_expiry_no_refund(gen_random_uuid(), gen_random_uuid()) INTO result;
            ASSERT (result::jsonb)->>'error' = 'NOT_FOUND', 'Test 31 FAILED: expected NOT_FOUND';
            RAISE NOTICE 'Test 31 PASSED: service_role executes finalize_expiry_no_refund without JWT-GUC';
          END $$;

          -- Test 32: anon cannot execute reconcile_pending_refunds
          DO $$
          BEGIN
            SET LOCAL role TO 'anon';
            BEGIN
              PERFORM reconcile_pending_refunds(0, 0);
              RAISE EXCEPTION 'Test 32 FAILED: anon must not execute reconcile_pending_refunds';
            EXCEPTION WHEN insufficient_privilege THEN
              RAISE NOTICE 'Test 32 PASSED: anon rejected from reconcile_pending_refunds';
            END;
          END $$;

          -- Test 33: service_role can execute reconcile_pending_refunds without JWT-GUC
          DO $$
          DECLARE v JSONB;
          BEGIN
            SET LOCAL role TO 'service_role';
            SELECT reconcile_pending_refunds(0, 0)::jsonb INTO v;
            ASSERT v = '[]'::jsonb, 'Test 33 FAILED: expected empty array';
            RAISE NOTICE 'Test 33 PASSED: service_role executes reconcile_pending_refunds without JWT-GUC';
          END $$;

          DO $$ BEGIN RAISE NOTICE 'All 33 expiry tests passed (21 lifecycle + 12 authorization).'; END $$;
          SQL
      - name: Test job tracking Realtime authorization
        run: |

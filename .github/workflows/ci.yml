              VALUES ('job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa', 'broadcast', '{"lat":0}', 'location_update', true);
              RAISE EXCEPTION 'RT-11 FAILED: unrelated user must not INSERT';
            EXCEPTION WHEN insufficient_privilege THEN
              -- SQLSTATE 42501: RLS WITH CHECK violation
              RAISE NOTICE 'RT-11 PASSED: unrelated user denied INSERT';
            END;
          END $$;

          -- RT-12: Customer CAN INSERT on own active job
          DO $$
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'bbbbbbbb-1111-1111-1111-bbbbbbbbbbbb'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            INSERT INTO realtime.messages (topic, extension, payload, event, private)
            VALUES ('job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa', 'broadcast', '{"lat":1}', 'location_update', true);
            RAISE NOTICE 'RT-12 PASSED: customer can INSERT on own active tracking';
          END $$;

          -- RT-13: Provider CAN INSERT on own active job
          DO $$
          BEGIN
            CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $fn$ SELECT 'bbbbbbbb-2222-2222-2222-bbbbbbbbbbbb'::uuid; $fn$;
            SET LOCAL role TO 'authenticated';
            INSERT INTO realtime.messages (topic, extension, payload, event, private)
            VALUES ('job-tracking-bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa', 'broadcast', '{"lat":2}', 'location_update', true);
            RAISE NOTICE 'RT-13 PASSED: provider can INSERT on own active tracking';
          END $$;

          -- Cleanup
          DELETE FROM realtime.messages;
          DELETE FROM jobs WHERE id IN (
            'bbbbbbbb-0000-0000-0000-aaaaaaaaaaaa'::uuid,
            'bbbbbbbb-0000-0000-0000-cccccccccccc'::uuid,
            'bbbbbbbb-0000-0000-0000-dddddddddddd'::uuid
          );
          DELETE FROM services WHERE id = 'test-svc-rt';
          DELETE FROM auth.users WHERE id IN (
            'bbbbbbbb-1111-1111-1111-bbbbbbbbbbbb'::uuid,
            'bbbbbbbb-2222-2222-2222-bbbbbbbbbbbb'::uuid,
            'bbbbbbbb-3333-3333-3333-bbbbbbbbbbbb'::uuid
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE sql STABLE AS $$ SELECT gen_random_uuid(); $$;

          DO $$ BEGIN RAISE NOTICE 'All 13 Realtime tracking authorization tests passed.'; END $$;

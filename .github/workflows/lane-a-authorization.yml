name: Lane A Authorization Security

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/prevent_privileged_signup_role_metadata.sql'
      - '.github/workflows/lane-a-authorization.yml'

jobs:
  privileged-signup-boundary:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: torc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create Supabase Auth and authorization fixtures
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/torc_test" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA auth;
          CREATE TYPE public.user_role AS ENUM ('customer', 'provider', 'admin', 'support');
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;

          CREATE TABLE auth.users (
            id uuid PRIMARY KEY,
            email text,
            raw_user_meta_data jsonb NOT NULL DEFAULT '{}'::jsonb
          );

          CREATE TABLE public.profiles (
            id uuid PRIMARY KEY REFERENCES auth.users(id),
            email text,
            full_name text,
            first_name text,
            last_name text,
            phone text,
            role public.user_role NOT NULL DEFAULT 'customer',
            terms_accepted_at timestamptz,
            terms_version text,
            updated_at timestamptz NOT NULL DEFAULT now()
          );

          CREATE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE
          AS $$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;

          CREATE FUNCTION public.is_admin(user_id uuid) RETURNS boolean
          LANGUAGE sql STABLE SECURITY DEFINER SET search_path = public
          AS $$
            SELECT EXISTS (
              SELECT 1 FROM public.profiles
              WHERE id = user_id AND role = 'admin'
            )
          $$;

          GRANT USAGE ON SCHEMA public, auth TO anon, authenticated, service_role;
          GRANT SELECT ON public.profiles TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          GRANT EXECUTE ON FUNCTION public.is_admin(uuid) TO authenticated;
          SQL
      - name: Apply proposed migration
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/torc_test" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261008135507_prevent_privileged_signup_role_metadata.sql
      - name: Test profile, JWT subject, function ACL, and RLS behavior
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/torc_test" -v ON_ERROR_STOP=1 \
            -f supabase/tests/prevent_privileged_signup_role_metadata.sql

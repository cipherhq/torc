<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" fill="none">
  <!-- Hexagonal gear icon -->
  <g transform="translate(200, 160)">
    <!-- Outer hexagon -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="#4ECDC4" />
    <!-- Inner hexagon (cutout effect) -->
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="#3AB8B0" />
    <!-- Gear teeth -->
    <rect x="-12" y="-125" width="24" height="20" rx="4" fill="#4ECDC4"/>
    <rect x="-12" y="105" width="24" height="20" rx="4" fill="#4ECDC4"/>
    <rect x="90" y="-55" width="24" height="20" rx="4" fill="#4ECDC4" transform="rotate(60 102 -45)"/>
    <rect x="-114" y="-55" width="24" height="20" rx="4" fill="#4ECDC4" transform="rotate(-60 -102 -45)"/>
    <rect x="90" y="35" width="24" height="20" rx="4" fill="#4ECDC4" transform="rotate(-60 102 45)"/>
    <rect x="-114" y="35" width="24" height="20" rx="4" fill="#4ECDC4" transform="rotate(60 -102 45)"/>
    <!-- Inner gear circle -->
    <circle cx="0" cy="0" r="55" fill="#1E2D3D"/>
    <circle cx="0" cy="0" r="40" fill="#3AB8B0"/>
    <!-- Wrench/bolt symbol -->
    <circle cx="0" cy="0" r="22" fill="#1E2D3D"/>
    <circle cx="0" cy="0" r="12" fill="#4ECDC4"/>
    <!-- Spokes -->
    <rect x="-3" y="-40" width="6" height="18" fill="#1E2D3D"/>
    <rect x="-3" y="22" width="6" height="18" fill="#1E2D3D"/>
    <rect x="-40" y="-3" width="18" height="6" fill="#1E2D3D"/>
    <rect x="22" y="-3" width="18" height="6" fill="#1E2D3D"/>
    <rect x="16" y="-30" width="6" height="18" fill="#1E2D3D" transform="rotate(45 19 -21)"/>
    <rect x="-22" y="12" width="6" height="18" fill="#1E2D3D" transform="rotate(45 -19 21)"/>
    <rect x="16" y="12" width="6" height="18" fill="#1E2D3D" transform="rotate(-45 19 21)"/>
    <rect x="-22" y="-30" width="6" height="18" fill="#1E2D3D" transform="rotate(-45 -19 -21)"/>
  </g>
  <!-- TORC text -->
  <text x="200" y="340" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="72" font-weight="800" fill="#1E2D3D" letter-spacing="8">TORC</text>
  <!-- Subtitle -->
  <text x="200" y="380" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#4ECDC4" letter-spacing="6">AUTO SERVICES ON-DEMAND</text>
</svg>
